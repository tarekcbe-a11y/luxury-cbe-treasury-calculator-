<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>حاسبة أذون الخزانة المصرية</title>

<style>
*{box-sizing:border-box}

html,body{
 margin:0;
 padding:0;
 width:100%;
 min-height:100%;
 background:#050505;
}

body{
 color:#fff;
 font-family:"Geeza Pro","Avenir Next",-apple-system,BlinkMacSystemFont,sans-serif;
 overflow-x:hidden;
}

.screen{
 width:calc(100% - 24px);
 max-width:450px;
 margin:12px auto;
 background:
 linear-gradient(145deg,#151515 0%,#050505 45%,#111 100%);
 border:1px solid #d4af37;
 border-radius:18px;
 box-shadow:
 0 0 0 1px rgba(212,175,55,.08),
 inset 0 0 35px rgba(255,255,255,.025);
}

.app{
 padding:14px;
}

/* HEADER */
.header{
 position:relative;
 min-height:86px;
 display:flex;
 flex-direction:column;
 align-items:center;
 justify-content:flex-start;
 border-bottom:1px solid rgba(212,175,55,.45);
 padding-bottom:10px;
}

.lang-btn{
 position:absolute;
 top:0;
 left:0;
 background:#090909;
 color:#d4af37;
 border:1px solid #d4af37;
 border-radius:7px;
 padding:5px 9px;
 font-size:11px;
 font-weight:600;
}

.title-space{
 margin-top:43px;
 width:100%;
}

.main-title{
 text-align:center;
 color:#d4af37;
 font-size:21px;
 line-height:1.35;
 font-weight:600;
 margin:0;
}

/* MARKET */
.market{
 display:flex;
 gap:8px;
 margin:13px 0 10px;
}

.market button{
 flex:1;
 height:44px;
 border-radius:9px;
 border:1px solid #d4af37;
 background:linear-gradient(145deg,#171717,#070707);
 color:#fff;
 font-size:15px;
 font-weight:500;
}

.market button.active{
 background:linear-gradient(145deg,#e0bd48,#b89020);
 color:#050505;
}

/* INPUTS */
input,select{
 width:100%;
 height:47px;
 padding:7px 12px;
 margin:4px 0;
 border-radius:9px;
 border:1px solid #d4af37;
 background:linear-gradient(145deg,#151515,#070707);
 color:#fff;
 font-family:inherit;
 font-size:16px;
 outline:none;
}

input{
 direction:rtl;
 text-align:right;
}

input::placeholder{
 color:#aaa;
 opacity:1;
}

select{
 direction:rtl;
 text-align:right;
}

/* CALCULATE */
.calc{
 width:100%;
 height:48px;
 margin:10px 0;
 border:1px solid #d4af37;
 border-radius:9px;
 background:linear-gradient(145deg,#e0bd48,#b89020);
 color:#050505;
 font-family:inherit;
 font-size:17px;
 font-weight:600;
}

/* RESULTS 2 x 2 */
.results{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:8px;
 margin-top:10px;
}

.card{
 min-width:0;
 min-height:72px;
 padding:9px 6px;
 text-align:center;
 border:1px solid rgba(212,175,55,.8);
 border-radius:9px;
 background:linear-gradient(145deg,#141414,#070707);
}

.card span{
 display:block;
 color:#ddd;
 font-size:11px;
 line-height:1.4;
 min-height:30px;
}

.card strong{
 display:block;
 color:#d4af37;
 font-size:17px;
 line-height:1.2;
 font-weight:500;
 margin-top:3px;
 white-space:nowrap;
}

/* TOTAL */
.total{
 margin-top:9px;
 padding:11px 8px;
 text-align:center;
 border:1px solid #d4af37;
 border-radius:10px;
 background:linear-gradient(145deg,#171717,#070707);
}

.total-label{
 color:#eee;
 font-size:13px;
}

.total-value{
 color:#d4af37;
 font-size:22px;
 font-weight:500;
 line-height:1.3;
 margin-top:4px;
}

.annual{
 margin-top:5px;
 color:#ddd;
 font-size:12px;
}

.annual b{
 color:#d4af37;
 font-size:15px;
 font-weight:500;
}

/* ACTIONS */
.action-button{
 width:100%;
 height:45px;
 margin:8px 0;
 display:flex;
 align-items:center;
 justify-content:center;
 text-decoration:none;
 border:1px solid #d4af37;
 border-radius:9px;
 background:linear-gradient(145deg,#151515,#070707);
 color:#d4af37;
 font-family:inherit;
 font-size:15px;
 font-weight:500;
}

/* FOOTER */
.footer{
 margin-top:11px;
 padding-top:9px;
 text-align:center;
 border-top:1px solid rgba(212,175,55,.4);
 font-size:11px;
 line-height:1.8;
}

.footer a{
 color:#d4af37;
 text-decoration:none;
 padding:2px 4px;
}

.footer-name{
 color:#aaa;
}

@media(max-width:360px){
 .app{padding:11px}
 .main-title{font-size:19px}
 .market button{font-size:13px}
 input,select{font-size:15px}
 .card strong{font-size:15px}
 .total-value{font-size:20px}
}
</style>
</head>

<body>

<div class="screen">
<div class="app">

<header class="header">
<button class="lang-btn" id="langBtn" onclick="toggleLang()">English</button>
<div class="title-space">
<div class="main-title" id="mainTitle">حاسبة أذون الخزانة المصرية</div>
</div>
</header>

<div class="market">
<button id="primaryBtn" class="active" onclick="setMarket('primary',true)">السوق الأولي</button>
<button id="secondaryBtn" onclick="setMarket('secondary',true)">السوق الثانوي</button>
</div>

<input id="nominal"
type="text"
inputmode="decimal"
placeholder="القيمة الاسمية"
oninput="formatNominal(this);saveCalculatorState()">

<input id="rate"
type="text"
inputmode="decimal"
placeholder="سعر العائد (%)"
oninput="saveCalculatorState()">

<select id="days" onchange="saveCalculatorState()"></select>

<button class="calc" id="calcBtn" onclick="calculate()">احسب الآن</button>

<div class="results">

<div class="card">
<span id="priceLabel">قيمة الشراء</span>
<strong id="priceResult">0.00</strong>
</div>

<div class="card">
<span id="discountLabel">خصم الشراء</span>
<strong id="discountResult">0.00</strong>
</div>

<div class="card">
<span id="taxLabel">الضريبة (20%)</span>
<strong id="taxResult">0.00</strong>
</div>

<div class="card">
<span id="profitLabel">صافي الربح بعد خصم الضريبة</span>
<strong id="profitResult">0.00</strong>
</div>

</div>

<div class="total">
<div class="total-label" id="totalLabel">المبلغ المسترد نهاية المدة</div>
<div class="total-value" id="totalResult">0.00</div>
<div class="annual">
<span id="annualLabel">نسبة العائد السنوي:</span>
<b id="annualResult">0.00%</b>
</div>
</div>

<a class="action-button"
href="saved.html"
id="savedLink"
onclick="saveAndOpen(event)">
حفظ العمليتين
</a>

<a class="action-button"
href="assistant.html"
id="assistantLink"
onclick="saveBeforeLeave()">
مساعدك الذكي
</a>

<div class="footer">
<a href="privacy.html" id="privacyLink" onclick="saveBeforeLeave()">سياسة الخصوصية</a>
|
<a href="about.html" id="aboutLink" onclick="saveBeforeLeave()">دليل أذون الخزانة</a>
<br>
<span class="footer-name" id="developer">أ/ طارق متولي</span>
</div>

</div>
</div>

<script>
let isArabic=true,currentMarket="primary";
const $=id=>document.getElementById(id);

function normalize(value){
 if(!value)return 0;
 const a={
  "٠":"0","١":"1","٢":"2","٣":"3","٤":"4",
  "٥":"5","٦":"6","٧":"7","٨":"8","٩":"9"
 };
 let text=String(value)
  .replace(/[٠-٩]/g,d=>a[d])
  .replace(/,/g,"");
 return parseFloat(text.replace(/[^0-9.]/g,""))||0;
}

function formatNominal(input){
 const value=normalize(input.value);
 input.value=value>0
  ?value.toLocaleString("en-US",{maximumFractionDigits:2})
  :"";
}

function money(value){
 return Number(value||0).toLocaleString("en-US",{
  minimumFractionDigits:2,
  maximumFractionDigits:2
 });
}

function setMarket(type,manual=false){
 currentMarket=type;

 $("primaryBtn").classList.toggle("active",type==="primary");
 $("secondaryBtn").classList.toggle("active",type==="secondary");

 const select=$("days");
 const old=select.value;

 select.innerHTML="";

 const list=type==="primary"
  ?[91,182,273,364]
  :Array.from({length:364},(_,i)=>i+1);

 list.forEach(d=>{
  const o=document.createElement("option");
  o.value=d;
  o.textContent=isArabic?d+" يوم":d+" Days";
  select.appendChild(o);
 });

 if(list.includes(Number(old)))select.value=old;

 if(manual)saveCalculatorState();
}

/* الحسبة الأصلية بدون تغيير */
function calculate(){

 const P=normalize($("nominal").value);
 const R=normalize($("rate").value)/100;
 const D=parseInt($("days").value)||0;

 if(P<=0||R<=0||D<=0)return;

 const price=P/(1+(R*D/365));
 const discount=P-price;
 const tax=discount*.20;
 const netProfit=discount-tax;
 const finalAmount=price+netProfit;
 const annualYield=(netProfit/price)*(365/D)*100;

 $("priceResult").textContent=money(price);
 $("discountResult").textContent=money(discount);
 $("taxResult").textContent=money(tax);
 $("profitResult").textContent=money(netProfit);
 $("totalResult").textContent=money(finalAmount);
 $("annualResult").textContent=annualYield.toFixed(2)+"%";

 const operation={
  nominal:P,
  rate:R*100,
  days:D,
  purchaseValue:price,
  discount,
  tax,
  netProfit,
  finalAmount,
  annualYield,
  market:currentMarket,
  date:new Date().toISOString()
 };

 localStorage.setItem("currentOperation",JSON.stringify(operation));

 saveCalculatorState();
}

function saveCalculatorState(){

 const state={
  nominal:$("nominal").value,
  rate:$("rate").value,
  days:$("days").value,
  market:currentMarket,
  price:$("priceResult").textContent,
  discount:$("discountResult").textContent,
  tax:$("taxResult").textContent,
  profit:$("profitResult").textContent,
  total:$("totalResult").textContent,
  annual:$("annualResult").textContent
 };

 localStorage.setItem("calculatorState",JSON.stringify(state));
}

function restoreCalculatorState(){

 try{

  const raw=localStorage.getItem("calculatorState");

  if(!raw){
   setMarket("primary");
   return;
  }

  const s=JSON.parse(raw);

  if(s.market)setMarket(s.market);

  if(s.days)$("days").value=s.days;
  if(s.nominal)$("nominal").value=s.nominal;
  if(s.rate)$("rate").value=s.rate;

  if(s.price)$("priceResult").textContent=s.price;
  if(s.discount)$("discountResult").textContent=s.discount;
  if(s.tax)$("taxResult").textContent=s.tax;
  if(s.profit)$("profitResult").textContent=s.profit;
  if(s.total)$("totalResult").textContent=s.total;
  if(s.annual)$("annualResult").textContent=s.annual;

 }catch(e){
  setMarket("primary");
 }
}

function saveBeforeLeave(){
 saveCalculatorState();
}

function saveAndOpen(event){

 event.preventDefault();

 saveCalculatorState();

 const current=localStorage.getItem("currentOperation");

 if(!current){
  alert(
   isArabic
   ?"من فضلك احسب العملية أولًا."
   :"Please calculate an operation first."
  );
  return;
 }

 let operations=[];

 try{
  operations=JSON.parse(
   localStorage.getItem("savedOperations")||"[]"
  );
 }catch(e){}

 if(!Array.isArray(operations))operations=[];

 try{
  operations.unshift(JSON.parse(current));
  operations=operations.slice(0,2);

  localStorage.setItem(
   "savedOperations",
   JSON.stringify(operations)
  );

 }catch(e){}

 window.location.href="saved.html";
}

function toggleLang(){

 isArabic=!isArabic;

 document.documentElement.lang=isArabic?"ar":"en";
 document.documentElement.dir=isArabic?"rtl":"ltr";

 $("langBtn").textContent=isArabic?"English":"العربية";

 $("mainTitle").textContent=isArabic
  ?"حاسبة أذون الخزانة المصرية"
  :"Egyptian Treasury Bills Calculator";

 $("primaryBtn").textContent=isArabic
  ?"السوق الأولي"
  :"Primary Market";

 $("secondaryBtn").textContent=isArabic
  ?"السوق الثانوي"
  :"Secondary Market";

 $("calcBtn").textContent=isArabic
  ?"احسب الآن"
  :"Calculate Now";

 $("nominal").placeholder=isArabic
  ?"القيمة الاسمية"
  :"Nominal Value";

 $("rate").placeholder=isArabic
  ?"سعر العائد (%)"
  :"Yield Rate (%)";

 $("priceLabel").textContent=isArabic
  ?"قيمة الشراء"
  :"Purchase Value";

 $("discountLabel").textContent=isArabic
  ?"خصم الشراء"
  :"Purchase Discount";

 $("taxLabel").textContent=isArabic
  ?"الضريبة (20%)"
  :"Tax (20%)";

 $("profitLabel").textContent=isArabic
  ?"صافي الربح بعد خصم الضريبة"
  :"Net Profit After Tax";

 $("totalLabel").textContent=isArabic
  ?"المبلغ المسترد نهاية المدة"
  :"Amount Returned at Maturity";

 $("annualLabel").textContent=isArabic
  ?"نسبة العائد السنوي:"
  :"Annual Yield:";

 $("savedLink").textContent=isArabic
  ?"حفظ العمليتين"
  :"Save Two Operations";

 $("assistantLink").textContent=isArabic
  ?"مساعدك الذكي"
  :"Smart Assistant";

 $("privacyLink").textContent=isArabic
  ?"سياسة الخصوصية"
  :"Privacy Policy";

 $("aboutLink").textContent=isArabic
  ?"دليل أذون الخزانة"
  :"Treasury Bills Guide";

 $("developer").textContent=isArabic
  ?"أ/ طارق متولي"
  :"Tarek Metwally";

 setMarket(currentMarket);

 saveCalculatorState();
}

window.addEventListener("load",restoreCalculatorState);
window.addEventListener("pageshow",restoreCalculatorState);
</script>

</body>
</html>
