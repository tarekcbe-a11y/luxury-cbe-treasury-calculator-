<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>حاسبة أذون الخزانة المصرية</title>

<style>
*{
 box-sizing:border-box;
}

html,body{
 margin:0;
 padding:0;
 width:100%;
 min-height:100%;
 background:#050505;
}

body{
 color:#fff;
 font-family:"Geeza Pro","Avenir Next",-apple-system,BlinkMacSystemFont,sans-serif;
 overflow-x:hidden;
}

.screen{
 width:calc(100% - 24px);
 max-width:450px;
 margin:12px auto;
 background:linear-gradient(145deg,#151515 0%,#050505 45%,#111 100%);
 border:1px solid #d4af37;
 border-radius:18px;
 box-shadow:
 0 0 0 1px rgba(212,175,55,.08),
 inset 0 0 35px rgba(255,255,255,.025);
}

.app{
 padding:14px;
}

/* HEADER */
.header{
 position:relative;
 min-height:88px;
 display:flex;
 flex-direction:column;
 align-items:center;
 justify-content:flex-start;
 border-bottom:1px solid rgba(212,175,55,.45);
 padding-bottom:10px;
}

.language{
 position:absolute;
 top:0;
 left:0;
}

.language select{
 width:112px;
 height:30px;
 margin:0;
 padding:2px 7px;
 border:1px solid #d4af37;
 border-radius:7px;
 background:#090909;
 color:#d4af37;
 font-family:inherit;
 font-size:11px;
 font-weight:500;
 outline:none;
 direction:ltr;
}

.title-space{
 margin-top:43px;
 width:100%;
}

.main-title{
 text-align:center;
 color:#d4af37;
 font-size:21px;
 line-height:1.35;
 font-weight:600;
 margin:0;
}

/* MARKET */
.market{
 display:flex;
 gap:8px;
 margin:13px 0 10px;
}

.market button{
 flex:1;
 height:44px;
 border-radius:9px;
 border:1px solid #d4af37;
 background:linear-gradient(145deg,#171717,#070707);
 color:#fff;
 font-family:inherit;
 font-size:15px;
 font-weight:500;
}

.market button.active{
 background:linear-gradient(145deg,#e0bd48,#b89020);
 color:#050505;
}

/* INPUTS */
input,
.days-select{
 width:100%;
 height:47px;
 padding:7px 12px;
 margin:4px 0;
 border-radius:9px;
 border:1px solid #d4af37;
 background:linear-gradient(145deg,#151515,#070707);
 color:#fff;
 font-family:inherit;
 font-size:16px;
 outline:none;
}

input{
 direction:rtl;
 text-align:right;
}

input::placeholder{
 color:#aaa;
 opacity:1;
}

.days-select{
 direction:rtl;
 text-align:right;
}

/* CALCULATE */
.calc{
 width:100%;
 height:48px;
 margin:10px 0;
 border:1px solid #d4af37;
 border-radius:9px;
 background:linear-gradient(145deg,#e0bd48,#b89020);
 color:#050505;
 font-family:inherit;
 font-size:17px;
 font-weight:600;
}

/* RESULTS */
.results{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:8px;
 margin-top:10px;
}

.card{
 min-width:0;
 min-height:72px;
 padding:9px 6px;
 text-align:center;
 border:1px solid rgba(212,175,55,.8);
 border-radius:9px;
 background:linear-gradient(145deg,#141414,#070707);
}

.card span{
 display:block;
 color:#ddd;
 font-size:11px;
 line-height:1.4;
 min-height:30px;
}

.card strong{
 display:block;
 color:#d4af37;
 font-size:17px;
 line-height:1.2;
 font-weight:500;
 margin-top:3px;
 white-space:nowrap;
}

/* TOTAL */
.total{
 margin-top:9px;
 padding:11px 8px;
 text-align:center;
 border:1px solid #d4af37;
 border-radius:10px;
 background:linear-gradient(145deg,#171717,#070707);
}

.total-label{
 color:#eee;
 font-size:13px;
}

.total-value{
 color:#d4af37;
 font-size:22px;
 font-weight:500;
 line-height:1.3;
 margin-top:4px;
}

.annual{
 margin-top:5px;
 color:#ddd;
 font-size:12px;
}

.annual b{
 color:#d4af37;
 font-size:15px;
 font-weight:500;
}

/* ACTIONS */
.actions{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:8px;
 margin-top:8px;
}

.action-button{
 width:100%;
 height:45px;
 margin:0;
 display:flex;
 align-items:center;
 justify-content:center;
 text-decoration:none;
 border:1px solid #d4af37;
 border-radius:9px;
 background:linear-gradient(145deg,#151515,#070707);
 color:#d4af37;
 font-family:inherit;
 font-size:14px;
 font-weight:500;
}

/* FOOTER */
.footer{
 margin-top:11px;
 padding-top:9px;
 text-align:center;
 border-top:1px solid rgba(212,175,55,.4);
 font-size:11px;
 line-height:1.8;
}

.footer a{
 color:#d4af37;
 text-decoration:none;
 padding:2px 4px;
}

.footer-name{
 color:#aaa;
}

@media(max-width:360px){

 .app{
  padding:11px;
 }

 .main-title{
  font-size:19px;
 }

 .language select{
  width:105px;
  font-size:10px;
 }

 .market button{
  font-size:13px;
 }

 input,
 .days-select{
  font-size:15px;
 }

 .card strong{
  font-size:15px;
 }

 .total-value{
  font-size:20px;
 }

 .action-button{
  font-size:13px;
 }
}
</style>
</head>

<body>

<div class="screen">
<div class="app">

<header class="header">

<div class="language">
<select id="languageSelect" onchange="changeLanguage(this.value)">
<option value="ar">🇪🇬 العربية</option>
<option value="en">🇬🇧 English</option>
<option value="fr">🇫🇷 Français</option>
<option value="it">🇮🇹 Italiano</option>
<option value="de">🇩🇪 Deutsch</option>
</select>
</div>

<div class="title-space">
<div class="main-title" id="mainTitle">
حاسبة أذون الخزانة المصرية
</div>
</div>

</header>


<!-- MARKET -->

<div class="market">

<button
 id="primaryBtn"
 class="active"
 onclick="setMarket('primary',true)">
السوق الأولي
</button>

<button
 id="secondaryBtn"
 onclick="setMarket('secondary',true)">
السوق الثانوي
</button>

</div>


<!-- INPUTS -->

<input
 id="nominal"
 type="text"
 inputmode="decimal"
 placeholder="القيمة الاسمية"
 oninput="formatNominal(this);saveCalculatorState()">

<input
 id="rate"
 type="text"
 inputmode="decimal"
 placeholder="سعر العائد (%)"
 oninput="saveCalculatorState()">

<select
 id="days"
 class="days-select"
 onchange="saveCalculatorState()">
</select>


<!-- CALCULATE -->

<button
 class="calc"
 id="calcBtn"
 onclick="calculate()">
احسب الآن
</button>


<!-- RESULTS -->

<div class="results">

<div class="card">
<span id="priceLabel">قيمة الشراء</span>
<strong id="priceResult">0.00</strong>
</div>

<div class="card">
<span id="discountLabel">خصم الشراء</span>
<strong id="discountResult">0.00</strong>
</div>

<div class="card">
<span id="taxLabel">الضريبة (20%)</span>
<strong id="taxResult">0.00</strong>
</div>

<div class="card">
<span id="profitLabel">صافي الربح بعد خصم الضريبة</span>
<strong id="profitResult">0.00</strong>
</div>

</div>


<!-- TOTAL -->

<div class="total">

<div
 class="total-label"
 id="totalLabel">
المبلغ المسترد نهاية المدة
</div>

<div
 class="total-value"
 id="totalResult">
0.00
</div>

<div class="annual">

<span id="annualLabel">
نسبة العائد السنوي:
</span>

<b id="annualResult">
0.00%
</b>

</div>

</div>


<!-- ACTIONS -->

<div class="actions">

<a
 class="action-button"
 href="saved.html"
 id="savedLink"
 onclick="saveAndOpen(event)">
حفظ العمليتين
</a>

<a
 class="action-button"
 href="assistant.html"
 id="assistantLink"
 onclick="saveBeforeLeave()">
مساعدك الذكي
</a>

</div>


<!-- FOOTER -->

<div class="footer">

<a
 href="privacy.html"
 id="privacyLink"
 onclick="saveBeforeLeave()">
سياسة الخصوصية
</a>

|

<a
 href="about.html"
 id="aboutLink"
 onclick="saveBeforeLeave()">
دليل أذون الخزانة
</a>

<br>

<span
 class="footer-name"
 id="developer">
أ/ طارق متولي
</span>

</div>

</div>
</div>


<script>

let currentLanguage =
 localStorage.getItem("calculatorLanguage") || "ar";

let currentMarket="primary";

const $=id=>document.getElementById(id);


/* TRANSLATIONS */

const translations={

 ar:{
  title:"حاسبة أذون الخزانة المصرية",
  primary:"السوق الأولي",
  secondary:"السوق الثانوي",
  nominal:"القيمة الاسمية",
  rate:"سعر العائد (%)",
  calculate:"احسب الآن",
  price:"قيمة الشراء",
  discount:"خصم الشراء",
  tax:"الضريبة (20%)",
  profit:"صافي الربح بعد خصم الضريبة",
  total:"المبلغ المسترد نهاية المدة",
  annual:"نسبة العائد السنوي:",
  saved:"حفظ العمليتين",
  assistant:"مساعدك الذكي",
  privacy:"سياسة الخصوصية",
  guide:"دليل أذون الخزانة",
  developer:"أ/ طارق متولي",
  day:"يوم"
 },

 en:{
  title:"Egyptian Treasury Bills Calculator",
  primary:"Primary Market",
  secondary:"Secondary Market",
  nominal:"Nominal Value",
  rate:"Yield Rate (%)",
  calculate:"Calculate Now",
  price:"Purchase Value",
  discount:"Purchase Discount",
  tax:"Tax (20%)",
  profit:"Net Profit After Tax",
  total:"Amount Returned at Maturity",
  annual:"Annual Yield:",
  saved:"Save Two Operations",
  assistant:"Smart Assistant",
  privacy:"Privacy Policy",
  guide:"Treasury Bills Guide",
  developer:"Tarek Metwally",
  day:"Days"
 },

 fr:{
  title:"Calculateur des bons du Trésor égyptiens",
  primary:"Marché primaire",
  secondary:"Marché secondaire",
  nominal:"Valeur nominale",
  rate:"Taux de rendement (%)",
  calculate:"Calculer",
  price:"Valeur d'achat",
  discount:"Escompte d'achat",
  tax:"Impôt (20%)",
  profit:"Bénéfice net après impôt",
  total:"Montant remboursé à l'échéance",
  annual:"Rendement annuel :",
  saved:"Enregistrer deux opérations",
  assistant:"Assistant intelligent",
  privacy:"Politique de confidentialité",
  guide:"Guide des bons du Trésor",
  developer:"Tarek Metwally",
  day:"jours"
 },

 it:{
  title:"Calcolatore dei Buoni del Tesoro egiziani",
  primary:"Mercato primario",
  secondary:"Mercato secondario",
  nominal:"Valore nominale",
  rate:"Tasso di rendimento (%)",
  calculate:"Calcola",
  price:"Valore di acquisto",
  discount:"Sconto di acquisto",
  tax:"Imposta (20%)",
  profit:"Utile netto dopo le imposte",
  total:"Importo rimborsato alla scadenza",
  annual:"Rendimento annuo:",
  saved:"Salva due operazioni",
  assistant:"Assistente intelligente",
  privacy:"Informativa sulla privacy",
  guide:"Guida ai Buoni del Tesoro",
  developer:"Tarek Metwally",
  day:"giorni"
 },

 de:{
  title:"Ägyptischer Schatzwechsel-Rechner",
  primary:"Primärmarkt",
  secondary:"Sekundärmarkt",
  nominal:"Nominalwert",
  rate:"Rendite (%)",
  calculate:"Berechnen",
  price:"Kaufwert",
  discount:"Kaufrabatt",
  tax:"Steuer (20%)",
  profit:"Nettogewinn nach Steuern",
  total:"Rückzahlungsbetrag bei Fälligkeit",
  annual:"Jährliche Rendite:",
  saved:"Zwei Vorgänge speichern",
  assistant:"Intelligenter Assistent",
  privacy:"Datenschutzerklärung",
  guide:"Schatzwechsel-Leitfaden",
  developer:"Tarek Metwally",
  day:"Tage"
 }

};


/* NORMALIZE */

function normalize(value){

 if(!value)return 0;

 const a={
  "٠":"0",
  "١":"1",
  "٢":"2",
  "٣":"3",
  "٤":"4",
  "٥":"5",
  "٦":"6",
  "٧":"7",
  "٨":"8",
  "٩":"9"
 };

 let text=String(value)
  .replace(/[٠-٩]/g,d=>a[d])
  .replace(/,/g,"");

 return parseFloat(
  text.replace(/[^0-9.]/g,"")
 )||0;
}


/* FORMAT NOMINAL */

function formatNominal(input){

 const value=normalize(input.value);

 input.value=value>0
  ?value.toLocaleString(
   "en-US",
   {
    maximumFractionDigits:2
   }
  )
  :"";
}


/* MONEY */

function money(value){

 return Number(value||0).toLocaleString(
  "en-US",
  {
   minimumFractionDigits:2,
   maximumFractionDigits:2
  }
 );
}


/* MARKET */

function setMarket(type,manual=false){

 currentMarket=type;

 $("primaryBtn").classList.toggle(
  "active",
  type==="primary"
 );

 $("secondaryBtn").classList.toggle(
  "active",
  type==="secondary"
 );

 const select=$("days");
 const old=select.value;

 select.innerHTML="";

 const list=type==="primary"
  ?[91,182,273,364]
  :Array.from(
    {length:364},
    (_,i)=>i+1
   );

 const t=translations[currentLanguage];

 list.forEach(d=>{

  const o=document.createElement("option");

  o.value=d;

  o.textContent=
   currentLanguage==="ar"
   ?d+" "+t.day
   :d+" "+t.day;

  select.appendChild(o);

 });

 if(list.includes(Number(old))){
  select.value=old;
 }

 if(manual){
  saveCalculatorState();
 }
}


/* CALCULATE
   الحسبة الأصلية بدون تغيير
*/

function calculate(){

 const P=normalize(
  $("nominal").value
 );

 const R=normalize(
  $("rate").value
 )/100;

 const D=parseInt(
  $("days").value
 )||0;

 if(P<=0||R<=0||D<=0){
  return;
 }

 const price=
  P/(1+(R*D/365));

 const discount=
  P-price;

 const tax=
  discount*.20;

 const netProfit=
  discount-tax;

 const finalAmount=
  price+netProfit;

 const annualYield=
  (netProfit/price)*(365/D)*100;


 $("priceResult").textContent=
  money(price);

 $("discountResult").textContent=
  money(discount);

 $("taxResult").textContent=
  money(tax);

 $("profitResult").textContent=
  money(netProfit);

 $("totalResult").textContent=
  money(finalAmount);

 $("annualResult").textContent=
  annualYield.toFixed(2)+"%";


 const operation={

  nominal:P,
  rate:R*100,
  days:D,
  purchaseValue:price,
  discount:discount,
  tax:tax,
  netProfit:netProfit,
  finalAmount:finalAmount,
  annualYield:annualYield,
  market:currentMarket,
  date:new Date().toISOString()

 };


 localStorage.setItem(
  "currentOperation",
  JSON.stringify(operation)
 );

 saveCalculatorState();
}


/* SAVE STATE */

function saveCalculatorState(){

 const state={

  nominal:$("nominal").value,
  rate:$("rate").value,
  days:$("days").value,
  market:currentMarket,

  price:$("priceResult").textContent,
  discount:$("discountResult").textContent,
  tax:$("taxResult").textContent,
  profit:$("profitResult").textContent,
  total:$("totalResult").textContent,
  annual:$("annualResult").textContent

 };

 localStorage.setItem(
  "calculatorState",
  JSON.stringify(state)
 );
}


/* RESTORE */

function restoreCalculatorState(){

 try{

  const raw=
   localStorage.getItem(
    "calculatorState"
   );

  if(!raw){

   setMarket("primary");

   return;
  }

  const s=JSON.parse(raw);

  if(s.market){
   setMarket(s.market);
  }

  if(s.days){
   $("days").value=s.days;
  }

  if(s.nominal){
   $("nominal").value=s.nominal;
  }

  if(s.rate){
   $("rate").value=s.rate;
  }

  if(s.price){
   $("priceResult").textContent=s.price;
  }

  if(s.discount){
   $("discountResult").textContent=s.discount;
  }

  if(s.tax){
   $("taxResult").textContent=s.tax;
  }

  if(s.profit){
   $("profitResult").textContent=s.profit;
  }

  if(s.total){
   $("totalResult").textContent=s.total;
  }

  if(s.annual){
   $("annualResult").textContent=s.annual;
  }

 }catch(e){

  setMarket("primary");

 }
}


/* SAVE BEFORE LEAVING */

function saveBeforeLeave(){

 saveCalculatorState();

}


/* SAVE TWO OPERATIONS */

function saveAndOpen(event){

 event.preventDefault();

 saveCalculatorState();

 const current=
  localStorage.getItem(
   "currentOperation"
  );

 if(!current){

  const messages={
   ar:"من فضلك احسب العملية أولًا.",
   en:"Please calculate an operation first.",
   fr:"Veuillez d'abord calculer une opération.",
   it:"Calcola prima un'operazione.",
   de:"Bitte berechnen Sie zuerst einen Vorgang."
  };

  alert(messages[currentLanguage]);

  return;
 }

 let operations=[];

 try{

  operations=JSON.parse(
   localStorage.getItem(
    "savedOperations"
   )||"[]"
  );

 }catch(e){}

 if(!Array.isArray(operations)){
  operations=[];
 }

 try{

  operations.unshift(
   JSON.parse(current)
  );

  operations=
   operations.slice(0,2);

  localStorage.setItem(
   "savedOperations",
   JSON.stringify(operations)
  );

 }catch(e){}

 window.location.href=
  "saved.html";
}


/* LANGUAGE */

function changeLanguage(lang){

 if(!translations[lang]){
  lang="ar";
 }

 currentLanguage=lang;

 localStorage.setItem(
  "calculatorLanguage",
  lang
 );

 localStorage.setItem(
  "tb_lang",
  lang
 );

 const t=translations[lang];

 document.documentElement.lang=lang;

 document.documentElement.dir=
  lang==="ar"?"rtl":"ltr";


 $("languageSelect").value=lang;


 $("mainTitle").textContent=
  t.title;

 $("primaryBtn").textContent=
  t.primary;

 $("secondaryBtn").textContent=
  t.secondary;

 $("calcBtn").textContent=
  t.calculate;

 $("nominal").placeholder=
  t.nominal;

 $("rate").placeholder=
  t.rate;

 $("priceLabel").textContent=
  t.price;

 $("discountLabel").textContent=
  t.discount;

 $("taxLabel").textContent=
  t.tax;

 $("profitLabel").textContent=
  t.profit;

 $("totalLabel").textContent=
  t.total;

 $("annualLabel").textContent=
  t.annual;

 $("savedLink").textContent=
  t.saved;

 $("assistantLink").textContent=
  t.assistant;

 $("privacyLink").textContent=
  t.privacy;

 $("aboutLink").textContent=
  t.guide;

 $("developer").textContent=
  t.developer;


 const selectedDays=
  $("days").value;

 setMarket(currentMarket);

 if(selectedDays){
  $("days").value=selectedDays;
 }

}


/* LOAD */

window.addEventListener(
 "load",
 function(){

  const savedLanguage=
   localStorage.getItem(
    "calculatorLanguage"
   )||"ar";

  changeLanguage(savedLanguage);

  restoreCalculatorState();

 }
);


/* RETURN TO PAGE */

window.addEventListener(
 "pageshow",
 restoreCalculatorState
);

</script>

</body>
</html>
