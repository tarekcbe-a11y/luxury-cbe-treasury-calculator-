<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#050505">
<title>حاسبة أذون الخزانة المصرية</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html{
    overflow-x:hidden;
}

body{
    margin:0;
    padding:0;
    min-height:100vh;
    background:
        radial-gradient(circle at top, #171717 0%, #080808 42%, #020202 100%);
    color:#fff;
    font-family:"Geeza Pro","Avenir Next",-apple-system,BlinkMacSystemFont,sans-serif;
    overflow-x:hidden;
    overflow-y:auto;
}

button,
input,
select{
    font-family:inherit;
}

button{
    cursor:pointer;
}

.header{
    width:100%;
    max-width:520px;
    margin:auto;
    padding:9px 10px 5px;
    position:relative;
}

.language-box{
    position:absolute;
    top:8px;
    left:8px;
    z-index:10;
}

.language-box select{
    width:55px;
    height:27px;
    padding:0 3px;
    border:1px solid #a98936;
    border-radius:5px;
    background:#0c0c0c;
    color:#fff;
    font-size:11px;
    outline:none;
}

.title{
    text-align:center;
    color:#d4af37;
    font-size:20px;
    font-weight:600;
    line-height:1.25;
    padding:2px 65px 7px;
    white-space:nowrap;
}

.container{
    width:100%;
    max-width:520px;
    margin:0 auto;
    padding:0 9px 12px;
}

.calculator{
    border:1px solid #a98936;
    border-radius:10px;
    padding:9px;
    background:
        linear-gradient(
            145deg,
            #181818 0%,
            #0c0c0c 45%,
            #161616 100%
        );
    box-shadow:
        inset 0 0 0 1px rgba(255,255,255,.025),
        0 4px 18px rgba(0,0,0,.5);
}

.market-tabs{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:7px;
    margin-bottom:9px;
}

.market-btn{
    height:37px;
    border:1px solid #806923;
    border-radius:6px;
    background:
        linear-gradient(
            180deg,
            #1b1b1b,
            #090909
        );
    color:#d4af37;
    font-size:14px;
    font-weight:500;
}

.market-btn.active{
    background:
        linear-gradient(
            180deg,
            #c6a642,
            #8f7629
        );
    color:#050505;
    border-color:#e4c75d;
}

.inputs{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:7px;
    margin-bottom:9px;
}

.input-box{
    position:relative;
}

.input-box input,
.input-box select{
    width:100%;
    height:40px;
    border:1px solid #8d742c;
    border-radius:6px;
    background:
        linear-gradient(
            180deg,
            #151515,
            #080808
        );
    color:#fff;
    outline:none;
    font-size:14px;
    padding:0 9px;
}

.input-box input{
    direction:rtl;
    text-align:right;
}

.input-box select{
    direction:rtl;
    text-align:right;
}

.input-box input:focus,
.input-box select:focus{
    border-color:#d4af37;
    box-shadow:0 0 0 1px rgba(212,175,55,.15);
}

.calculate-btn{
    width:100%;
    height:40px;
    border:1px solid #d4af37;
    border-radius:6px;
    background:
        linear-gradient(
            180deg,
            #d4af37,
            #8f7629
        );
    color:#050505;
    font-size:15px;
    font-weight:600;
    margin-bottom:9px;
}

.calculate-btn:active,
.action-btn:active,
.market-btn:active{
    transform:translateY(1px);
}

.results{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:7px;
}

.result-box{
    min-height:69px;
    border:1px solid #806923;
    border-radius:6px;
    background:
        linear-gradient(
            145deg,
            #151515,
            #080808
        );
    padding:7px 8px;
    text-align:center;
    display:flex;
    flex-direction:column;
    justify-content:center;
}

.result-label{
    color:#fff;
    font-size:12px;
    line-height:1.3;
    margin-bottom:5px;
}

.result-value{
    color:#d4af37;
    font-size:17px;
    font-weight:500;
    line-height:1.2;
    direction:ltr;
}

.total-box{
    margin-top:7px;
    min-height:58px;
    border:1px solid #d4af37;
    border-radius:6px;
    background:
        linear-gradient(
            145deg,
            #1b1b1b,
            #090909
        );
    padding:7px;
    text-align:center;
}

.total-label{
    color:#fff;
    font-size:12px;
    margin-bottom:3px;
}

.total-value{
    color:#d4af37;
    font-size:22px;
    font-weight:500;
    line-height:1.2;
    direction:ltr;
}

.actions{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:7px;
    margin-top:9px;
}

.action-btn{
    height:39px;
    border:1px solid #696969;
    border-radius:6px;
    background:
        linear-gradient(
            180deg,
            #1c1c1c,
            #090909
        );
    color:#fff;
    font-size:12px;
    font-weight:500;
    padding:0 4px;
}

.action-btn:nth-child(2){
    border-color:#d4af37;
    color:#d4af37;
}

.new-entry-btn{
    border-color:#8f1d1d;
    color:#fff;
    background:
        linear-gradient(
            180deg,
            #8f1d1d,
            #5b0d0d
        );
}

.footer{
    width:100%;
    max-width:520px;
    margin:0 auto;
    padding:9px 9px 14px;
    text-align:center;
}

.footer-links{
    font-size:11px;
    margin-bottom:5px;
}

.footer-links a{
    color:#d4af37;
    text-decoration:none;
}

.footer-name{
    color:#fff;
    font-size:11px;
}

@media(max-width:360px){
    .title{
        font-size:18px;
        padding-right:58px;
        padding-left:58px;
    }

    .inputs{
        gap:5px;
    }

    .input-box input,
    .input-box select{
        padding:0 5px;
        font-size:12px;
    }

    .action-btn{
        font-size:11px;
    }
}
</style>
</head>

<body>

<header class="header">

    <div class="language-box">
        <select id="languageSelect" aria-label="Language">
            <option value="ar">ع</option>
            <option value="en">EN</option>
            <option value="fr">FR</option>
            <option value="it">IT</option>
            <option value="de">DE</option>
        </select>
    </div>

    <div class="title" id="pageTitle">
        حاسبة أذون الخزانة المصرية
    </div>

</header>

<main class="container">

    <section class="calculator">

        <section class="market-tabs">

            <button
                class="market-btn active"
                id="primaryBtn"
                onclick="setMarket('primary')">
                السوق الأولي
            </button>

            <button
                class="market-btn"
                id="secondaryBtn"
                onclick="setMarket('secondary')">
                السوق الثانوي
            </button>

        </section>

        <section class="inputs">

            <div class="input-box">
                <input
                    type="text"
                    id="nominal"
                    inputmode="decimal"
                    autocomplete="off"
                    placeholder="القيمة الاسمية">
            </div>

            <div class="input-box">
                <input
                    type="text"
                    id="rate"
                    inputmode="decimal"
                    autocomplete="off"
                    placeholder="سعر العائد (%)">
            </div>

            <div class="input-box">
                <select id="days"></select>
            </div>

        </section>

        <button
            class="calculate-btn"
            id="calculateBtn"
            onclick="calculate()">
            احسب
        </button>

        <section class="results">

            <div class="result-box">
                <div class="result-label" id="purchaseLabel">
                    قيمة الشراء
                </div>
                <div class="result-value" id="purchaseValue">
                    0
                </div>
            </div>

            <div class="result-box">
                <div class="result-label" id="discountLabel">
                    خصم الشراء
                </div>
                <div class="result-value" id="discountValue">
                    0
                </div>
            </div>

            <div class="result-box">
                <div class="result-label" id="taxLabel">
                    الضريبة
                </div>
                <div class="result-value" id="taxValue">
                    0
                </div>
            </div>

            <div class="result-box">
                <div class="result-label" id="profitLabel">
                    صافي الربح بعد خصم الضريبة
                </div>
                <div class="result-value" id="profitValue">
                    0
                </div>
            </div>

        </section>

        <section class="total-box">

            <div class="total-label" id="totalLabel">
                المبلغ المسترد نهاية المدة
            </div>

            <div class="total-value" id="totalValue">
                0
            </div>

        </section>

        <section class="result-box" style="margin-top:7px; min-height:58px;">

            <div class="result-label" id="annualLabel">
                العائد السنوي الصافي
            </div>

            <div class="result-value" id="annualValue">
                0.00%
            </div>

        </section>

        <section class="actions">

            <button
                class="action-btn new-entry-btn"
                onclick="newEntry()"
                id="newEntryBtn">
                إدخال جديد
            </button>

            <button
                class="action-btn"
                onclick="saveOperations()"
                id="saveBtn">
                حفظ العمليتين
            </button>

            <button
                class="action-btn"
                onclick="openAssistant()"
                id="assistantBtn">
                مساعدك الذكي
            </button>

        </section>

    </section>

</main>

<footer class="footer">

    <div class="footer-links">

        <a href="privacy.html" id="privacyLink">
            سياسة الخصوصية
        </a>

        <span> | </span>

        <a href="about.html" id="guideLink">
            دليل أذون الخزانة
        </a>

    </div>

    <div class="footer-name">
        أ/ طارق متولي
    </div>

</footer>

<script>

const translations = {

    ar:{
        title:"حاسبة أذون الخزانة المصرية",
        primary:"السوق الأولي",
        secondary:"السوق الثانوي",
        nominal:"القيمة الاسمية",
        rate:"سعر العائد (%)",
        calculate:"احسب",
        purchase:"قيمة الشراء",
        discount:"خصم الشراء",
        tax:"الضريبة",
        profit:"صافي الربح بعد خصم الضريبة",
        total:"المبلغ المسترد نهاية المدة",
        annual:"العائد السنوي الصافي",
        save:"حفظ العمليتين",
        assistant:"مساعدك الذكي",
        newEntry:"إدخال جديد",
        privacy:"سياسة الخصوصية",
        guide:"دليل أذون الخزانة"
    },

    en:{
        title:"Egyptian Treasury Bills Calculator",
        primary:"Primary Market",
        secondary:"Secondary Market",
        nominal:"Nominal Value",
        rate:"Yield Rate (%)",
        calculate:"Calculate",
        purchase:"Purchase Value",
        discount:"Purchase Discount",
        tax:"Tax",
        profit:"Net Profit After Tax",
        total:"Amount Returned at Maturity",
        annual:"Net Annual Yield",
        save:"Save Operations",
        assistant:"Smart Assistant",
        newEntry:"New Entry",
        privacy:"Privacy Policy",
        guide:"Treasury Bills Guide"
    },

    fr:{
        title:"Calculateur des bons du Trésor égyptiens",
        primary:"Marché primaire",
        secondary:"Marché secondaire",
        nominal:"Valeur nominale",
        rate:"Taux de rendement (%)",
        calculate:"Calculer",
        purchase:"Valeur d'achat",
        discount:"Décote d'achat",
        tax:"Impôt",
        profit:"Bénéfice net après impôt",
        total:"Montant remboursé à l'échéance",
        annual:"Rendement annuel net",
        save:"Enregistrer les opérations",
        assistant:"Assistant intelligent",
        newEntry:"Nouvelle saisie",
        privacy:"Politique de confidentialité",
        guide:"Guide des bons du Trésor"
    },

    it:{
        title:"Calcolatore dei Buoni del Tesoro egiziani",
        primary:"Mercato primario",
        secondary:"Mercato secondario",
        nominal:"Valore nominale",
        rate:"Tasso di rendimento (%)",
        calculate:"Calcola",
        purchase:"Valore di acquisto",
        discount:"Sconto di acquisto",
        tax:"Imposta",
        profit:"Utile netto dopo le imposte",
        total:"Importo rimborsato alla scadenza",
        annual:"Rendimento annuo netto",
        save:"Salva operazioni",
        assistant:"Assistente intelligente",
        newEntry:"Nuovo inserimento",
        privacy:"Privacy",
        guide:"Guida ai Buoni del Tesoro"
    },

    de:{
        title:"Ägyptischer Schatzwechsel-Rechner",
        primary:"Primärmarkt",
        secondary:"Sekundärmarkt",
        nominal:"Nennwert",
        rate:"Renditesatz (%)",
        calculate:"Berechnen",
        purchase:"Kaufwert",
        discount:"Kaufrabatt",
        tax:"Steuer",
        profit:"Nettogewinn nach Steuern",
        total:"Rückzahlungsbetrag bei Fälligkeit",
        annual:"Netto-Jahresrendite",
        save:"Vorgänge speichern",
        assistant:"Intelligenter Assistent",
        newEntry:"Neue Eingabe",
        privacy:"Datenschutz",
        guide:"Schatzwechsel-Leitfaden"
    }

};

let currentLanguage =
    localStorage.getItem("calculatorLanguage") || "ar";

let currentMarket =
    localStorage.getItem("calculatorMarket") || "primary";

const nominalInput = document.getElementById("nominal");
const rateInput = document.getElementById("rate");
const daysSelect = document.getElementById("days");

function normalizeInput(value){

    if(!value) return 0;

    let v = String(value)
        .replace(/,/g,"")
        .replace(/٬/g,"")
        .replace(/[^\d.]/g,"");

    return parseFloat(v) || 0;
}

function formatNumber(value, decimals = 2){

    if(!Number.isFinite(value)) return "0";

    return value.toLocaleString("en-US",{
        minimumFractionDigits:decimals,
        maximumFractionDigits:decimals
    });
}

function formatInputNumber(value){

    const number = normalizeInput(value);

    if(!number) return "";

    return number.toLocaleString("en-US",{
        maximumFractionDigits:2
    });
}

nominalInput.addEventListener("input",function(){

    const cursorEnd = this.selectionStart === this.value.length;

    this.value = formatInputNumber(this.value);

    if(cursorEnd){
        this.setSelectionRange(
            this.value.length,
            this.value.length
        );
    }

});

rateInput.addEventListener("input",function(){

    this.value = this.value
        .replace(/,/g,"")
        .replace(/٬/g,"")
        .replace(/[^\d.]/g,"");

});

function updateDays(){

    const previousValue = daysSelect.value;

    daysSelect.innerHTML = "";

    if(currentMarket === "primary"){

        [91,182,273,364].forEach(function(day){

            const option = document.createElement("option");

            option.value = day;
            option.textContent = day;

            daysSelect.appendChild(option);

        });

    }else{

        for(let day = 1; day <= 364; day++){

            const option = document.createElement("option");

            option.value = day;
            option.textContent = day;

            daysSelect.appendChild(option);

        }

    }

    if(
        previousValue &&
        [...daysSelect.options].some(
            option => option.value === previousValue
        )
    ){
        daysSelect.value = previousValue;
    }else{
        daysSelect.selectedIndex = 0;
    }

}

function setMarket(market){

    currentMarket = market;

    localStorage.setItem(
        "calculatorMarket",
        currentMarket
    );

    document
        .getElementById("primaryBtn")
        .classList.toggle(
            "active",
            market === "primary"
        );

    document
        .getElementById("secondaryBtn")
        .classList.toggle(
            "active",
            market === "secondary"
        );

    updateDays();

}

function calculate(){

    let P =
        normalizeInput(
            document.getElementById("nominal").value
        );

    let R =
        normalizeInput(
            document.getElementById("rate").value
        ) / 100;

    let D =
        parseInt(
            document.getElementById("days").value
        ) || 0;

    if(P <= 0 || R <= 0 || D <= 0){

        return;

    }

    /*
        الحسبة الأصلية المعتمدة:

        Purchase Price =
        P / (1 + (R * D / 365))

        Gross Profit =
        P - Purchase Price

        Tax =
        Gross Profit * 20%

        Net Profit =
        Gross Profit - Tax

        Final Amount =
        Purchase Price + Net Profit

        Net Annual Yield =
        (Net Profit / Purchase Price)
        * (365 / D) * 100
    */

    let price =
        P / (1 + (R * D / 365));

    let profit =
        P - price;

    let tax =
        profit * 0.20;

    let netProfit =
        profit - tax;

    let finalAmount =
        price + netProfit;

    let annualYield =
        (netProfit / price) *
        (365 / D) *
        100;

    document.getElementById("purchaseValue")
        .textContent = formatNumber(price);

    document.getElementById("discountValue")
        .textContent = formatNumber(profit);

    document.getElementById("taxValue")
        .textContent = formatNumber(tax);

    document.getElementById("profitValue")
        .textContent = formatNumber(netProfit);

    document.getElementById("totalValue")
        .textContent = formatNumber(finalAmount);

    document.getElementById("annualValue")
        .textContent =
        formatNumber(annualYield) + "%";

    const operation = {

        nominal:P,
        rate:R * 100,
        days:D,
        market:currentMarket,

        purchaseValue:price,
        discountValue:profit,
        taxValue:tax,
        profitValue:netProfit,
        totalValue:finalAmount,
        annualValue:annualYield,

        date:new Date().toISOString()

    };

    localStorage.setItem(
        "lastTreasuryOperation",
        JSON.stringify(operation)
    );

}

function newEntry(){

    nominalInput.value = "";
    rateInput.value = "";

    daysSelect.selectedIndex = 0;

    document.getElementById("purchaseValue")
        .textContent = "0";

    document.getElementById("discountValue")
        .textContent = "0";

    document.getElementById("taxValue")
        .textContent = "0";

    document.getElementById("profitValue")
        .textContent = "0";

    document.getElementById("totalValue")
        .textContent = "0";

    document.getElementById("annualValue")
        .textContent = "0.00%";

    /*
        حذف العملية الحالية فقط،
        مع الاحتفاظ بالعمليتين المحفوظتين.
    */
    localStorage.removeItem(
        "lastTreasuryOperation"
    );

    nominalInput.focus();

}

function saveOperations(){

    const lastOperation =
        localStorage.getItem(
            "lastTreasuryOperation"
        );

    if(!lastOperation){

        return;

    }

    let operations = [];

    try{

        operations =
            JSON.parse(
                localStorage.getItem(
                    "treasuryOperations"
                )
            ) || [];

    }catch(e){

        operations = [];

    }

    operations.unshift(
        JSON.parse(lastOperation)
    );

    operations =
        operations.slice(0,2);

    localStorage.setItem(
        "treasuryOperations",
        JSON.stringify(operations)
    );

    window.location.href = "saved.html";

}

function openAssistant(){

    window.location.href =
        "assistant.html";

}

function applyLanguage(){

    const t =
        translations[currentLanguage];

    document.documentElement.lang =
        currentLanguage;

    document.documentElement.dir =
        currentLanguage === "ar"
            ? "rtl"
            : "ltr";

    document.getElementById("pageTitle")
        .textContent = t.title;

    document.getElementById("primaryBtn")
        .textContent = t.primary;

    document.getElementById("secondaryBtn")
        .textContent = t.secondary;

    nominalInput.placeholder =
        t.nominal;

    rateInput.placeholder =
        t.rate;

    document.getElementById("calculateBtn")
        .textContent = t.calculate;

    document.getElementById("purchaseLabel")
        .textContent = t.purchase;

    document.getElementById("discountLabel")
        .textContent = t.discount;

    document.getElementById("taxLabel")
        .textContent = t.tax;

    document.getElementById("profitLabel")
        .textContent = t.profit;

    document.getElementById("totalLabel")
        .textContent = t.total;

    document.getElementById("annualLabel")
        .textContent = t.annual;

    document.getElementById("saveBtn")
        .textContent = t.save;

    document.getElementById("assistantBtn")
        .textContent = t.assistant;

    document.getElementById("newEntryBtn")
        .textContent = t.newEntry;

    document.getElementById("privacyLink")
        .textContent = t.privacy;

    document.getElementById("guideLink")
        .textContent = t.guide;

}

document
    .getElementById("languageSelect")
    .value = currentLanguage;

document
    .getElementById("languageSelect")
    .addEventListener("change",function(){

        currentLanguage = this.value;

        localStorage.setItem(
            "calculatorLanguage",
            currentLanguage
        );

        applyLanguage();

    });

setMarket(currentMarket);
applyLanguage();

function restoreValues(){

    const saved =
        localStorage.getItem(
            "lastTreasuryOperation"
        );

    if(!saved) return;

    try{

        const operation =
            JSON.parse(saved);

        if(operation.market){

            setMarket(
                operation.market
            );

        }

        if(operation.nominal){

            nominalInput.value =
                formatInputNumber(
                    operation.nominal
                );

        }

        if(operation.rate){

            rateInput.value =
                operation.rate;

        }

        if(operation.days){

            daysSelect.value =
                operation.days;

        }

        if(
            operation.purchaseValue !== undefined
        ){

            document
                .getElementById("purchaseValue")
                .textContent =
                formatNumber(
                    operation.purchaseValue
                );

        }

        if(
            operation.discountValue !== undefined
        ){

            document
                .getElementById("discountValue")
                .textContent =
                formatNumber(
                    operation.discountValue
                );

        }

        if(
            operation.taxValue !== undefined
        ){

            document
                .getElementById("taxValue")
                .textContent =
                formatNumber(
                    operation.taxValue
                );

        }

        if(
            operation.profitValue !== undefined
        ){

            document
                .getElementById("profitValue")
                .textContent =
                formatNumber(
                    operation.profitValue
                );

        }

        if(
            operation.totalValue !== undefined
        ){

            document
                .getElementById("totalValue")
                .textContent =
                formatNumber(
                    operation.totalValue
                );

        }

        if(
            operation.annualValue !== undefined
        ){

            document
                .getElementById("annualValue")
                .textContent =
                formatNumber(
                    operation.annualValue
                ) + "%";

        }

    }catch(e){

        localStorage.removeItem(
            "lastTreasuryOperation"
        );

    }

}

restoreValues();

</script>

</body>
</html>
