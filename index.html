<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#12385f">
<title>حاسبة أذون الخزانة المصرية</title>

<style>
*{
 box-sizing:border-box;
 -webkit-tap-highlight-color:transparent;
}

html,body{
 margin:0;
 padding:0;
 width:100%;
 min-height:100%;
 background:#edf3f8;
 font-family:Tahoma,Arial,sans-serif;
}

body{
 color:#12385f;
 overflow-x:hidden;
 touch-action:pan-y;
}

.app{
 width:calc(100% - 12px);
 max-width:460px;
 margin:6px auto;
 background:#fff;
 border:2px solid #e8bd45;
 border-radius:20px;
 box-shadow:0 5px 20px rgba(18,56,95,.16);
 padding:10px;
}

.header{
 position:relative;
 text-align:center;
 padding:4px 70px 13px;
}

.title{
 color:#12385f;
 font-size:22px;
 font-weight:900;
 line-height:1.35;
 margin:0;
}

.language-wrap{
 position:absolute;
 left:0;
 top:0;
}

.language-btn{
 border:1px solid #e8bd45;
 background:#12385f;
 color:#fff;
 border-radius:8px;
 padding:5px 8px;
 font-size:10px;
 font-weight:bold;
 cursor:pointer;
}

.language-menu{
 display:none;
 position:absolute;
 left:0;
 top:31px;
 width:120px;
 background:#fff;
 border:1px solid #e8bd45;
 border-radius:9px;
 box-shadow:0 5px 15px rgba(0,0,0,.15);
 overflow:hidden;
 z-index:100;
}

.language-menu.show{
 display:block;
}

.language-menu button{
 width:100%;
 border:0;
 border-bottom:1px solid #edf0f3;
 background:#fff;
 color:#12385f;
 padding:8px 6px;
 font-size:11px;
 font-weight:bold;
 text-align:center;
 cursor:pointer;
}

.language-menu button:last-child{
 border-bottom:0;
}

.language-menu button:hover{
 background:#f4d36b;
}

.market{
 display:flex;
 gap:8px;
 margin-bottom:9px;
}

.market button{
 flex:1;
 height:46px;
 border:2px solid #12385f;
 border-radius:11px;
 background:#fff;
 color:#12385f;
 font-size:15px;
 font-weight:900;
}

.market button.active{
 background:#f4d36b;
 border-color:#e8bd45;
 color:#12385f;
}

.field{
 width:100%;
 height:48px;
 margin:4px 0;
 border:2px solid #d2dce7;
 border-radius:10px;
 background:#fff;
 color:#12385f;
 font-size:17px;
 font-weight:bold;
 padding:8px 12px;
 outline:none;
}

.field:focus{
 border-color:#e8bd45;
 box-shadow:0 0 0 2px rgba(232,189,69,.18);
}

input{
 direction:rtl;
 text-align:right;
 unicode-bidi:plaintext;
}

input::placeholder{
 color:#6d7c8c;
 opacity:1;
}

select{
 direction:rtl;
 text-align:right;
}

.calculate{
 width:100%;
 height:50px;
 margin:8px 0;
 border:0;
 border-radius:11px;
 background:#12385f;
 color:#fff;
 font-size:18px;
 font-weight:900;
 box-shadow:0 3px 8px rgba(18,56,95,.18);
}

.results{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:9px;
 margin-top:2px;
}

.result-card{
 min-height:82px;
 border-radius:13px;
 padding:9px 7px;
 text-align:center;
 display:flex;
 flex-direction:column;
 align-items:center;
 justify-content:center;
 border:1px solid rgba(18,56,95,.08);
}

.result-card span{
 color:#12385f;
 font-size:12px;
 font-weight:900;
 line-height:1.4;
}

.result-card strong{
 color:#12385f;
 font-family:Arial,sans-serif;
 font-size:17px;
 font-weight:900;
 margin-top:5px;
 direction:ltr;
 unicode-bidi:plaintext;
}

.purchase{
 background:#fff1cf;
}

.discount{
 background:#dceaff;
}

.tax{
 background:#dff5ea;
}

.profit{
 background:#dff5ea;
}

.total{
 margin-top:9px;
 border:2px solid #e8bd45;
 border-radius:13px;
 background:#f5f9fc;
 text-align:center;
 padding:9px;
}

.total-label{
 color:#12385f;
 font-size:13px;
 font-weight:900;
}

.total-value{
 color:#12385f;
 font-family:Arial,sans-serif;
 font-size:22px;
 font-weight:900;
 margin-top:4px;
 direction:ltr;
 unicode-bidi:plaintext;
}

.annual{
 color:#12385f;
 font-size:12px;
 font-weight:bold;
 margin-top:4px;
}

.annual strong{
 font-family:Arial,sans-serif;
 font-size:14px;
}

.actions{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:8px;
 margin-top:9px;
}

.action{
 height:46px;
 border:2px solid #12385f;
 border-radius:10px;
 background:#fff;
 color:#12385f;
 display:flex;
 align-items:center;
 justify-content:center;
 text-decoration:none;
 font-size:14px;
 font-weight:900;
 text-align:center;
}

.action.primary{
 background:#12385f;
 color:#fff;
}

.note{
 text-align:center;
 color:#6d7c8c;
 font-size:10px;
 line-height:1.4;
 margin:2px 0 0;
}

.footer{
 margin-top:0;
 padding-top:3px;
 border-top:1px solid #dbe3eb;
 text-align:center;
 font-size:11px;
 line-height:1.6;
}

.footer a{
 color:#12385f;
 text-decoration:none;
 font-weight:bold;
}

.developer{
 color:#6d7c8c;
}

@media(max-width:360px){

 .app{
  padding:8px;
 }

 .header{
  padding-left:60px;
  padding-right:60px;
  padding-bottom:12px;
 }

 .title{
  font-size:20px;
 }

 .language-btn{
  font-size:9px;
  padding:5px 7px;
 }

 .market button{
  font-size:13px;
  height:44px;
 }

 .field{
  height:46px;
  font-size:16px;
 }

 .result-card{
  min-height:76px;
 }

 .result-card span{
  font-size:11px;
 }

 .result-card strong{
  font-size:15px;
 }

 .total-value{
  font-size:20px;
 }

 .action{
  font-size:12px;
 }
}
</style>
</head>

<body>

<div class="app">

<header class="header">

<div class="language-wrap">

<button
 class="language-btn"
 id="languageBtn"
 type="button"
 onclick="toggleLanguageMenu()">
 English
</button>

<div
 class="language-menu"
 id="languageMenu">

<button type="button" onclick="changeLanguage('ar')">
العربية
</button>

<button type="button" onclick="changeLanguage('en')">
English
</button>

<button type="button" onclick="changeLanguage('fr')">
Français
</button>

<button type="button" onclick="changeLanguage('it')">
Italiano
</button>

<button type="button" onclick="changeLanguage('de')">
Deutsch
</button>

</div>

</div>

<div
 class="title"
 id="title">
حاسبة أذون الخزانة المصرية
</div>

</header>


<div class="market">

<button
 id="primaryBtn"
 class="active"
 type="button"
 onclick="setMarket('primary')">
السوق الأولي
</button>

<button
 id="secondaryBtn"
 type="button"
 onclick="setMarket('secondary')">
السوق الثانوي
</button>

</div>


<input
 class="field"
 id="nominal"
 type="text"
 inputmode="decimal"
 autocomplete="off"
 placeholder="القيمة الاسمية"
 oninput="formatNominal(this)"
>


<input
 class="field"
 id="rate"
 type="text"
 inputmode="decimal"
 autocomplete="off"
 placeholder="سعر العائد (%)"
>


<select
 class="field"
 id="days">
</select>


<button
 class="calculate"
 id="calculateBtn"
 type="button"
 onclick="calculate()">
احسب الآن
</button>


<!-- أربعة مربعات فقط -->

<div class="results">

<div class="result-card purchase">

<span id="priceLabel">
قيمة الشراء
</span>

<strong id="priceResult">
0.00
</strong>

</div>


<div class="result-card discount">

<span id="discountLabel">
خصم الشراء
</span>

<strong id="discountResult">
0.00
</strong>

</div>


<div class="result-card tax">

<span id="taxLabel">
الضريبة
</span>

<strong id="taxResult">
0.00
</strong>

</div>


<div class="result-card profit">

<span id="profitLabel">
صافي الربح بعد خصم الضريبة
</span>

<strong id="profitResult">
0.00
</strong>

</div>

</div>


<div class="total">

<div
 class="total-label"
 id="totalLabel">
المبلغ المسترد نهاية المدة
</div>

<div
 class="total-value"
 id="totalResult">
0.00
</div>

<div class="annual">

<span id="annualLabel">
نسبة العائد السنوي:
</span>

<strong id="annualResult">
0.00%
</strong>

</div>

</div>


<div class="actions">

<a
 class="action"
 href="saved.html"
 id="savedLink"
 onclick="saveAndOpen(event)">
حفظ العمليتين
</a>


<a
 class="action primary"
 href="assistant.html"
 id="assistantLink"
 onclick="saveBeforeLeave()">
مساعدك الذكي
</a>

</div>


<div
 class="note"
 id="note">
يتم حفظ آخر عملية تلقائيًا على جهازك.
</div>


<footer class="footer">

<a
 href="privacy.html"
 id="privacyLink"
 onclick="saveBeforeLeave()">
سياسة الخصوصية
</a>

<span> | </span>

<a
 href="about.html"
 id="guideLink"
 onclick="saveBeforeLeave()">
دليل أذون الخزانة
</a>

<div class="developer">
أ/ طارق متولي
</div>

</footer>

</div>


<script>

let currentLanguage="ar";
let currentMarket="primary";

const $=id=>document.getElementById(id);


/* =========================
   اللغات الخمس
========================= */

const translations={

ar:{
 language:"English",
 title:"حاسبة أذون الخزانة المصرية",
 primary:"السوق الأولي",
 secondary:"السوق الثانوي",
 nominal:"القيمة الاسمية",
 rate:"سعر العائد (%)",
 calculate:"احسب الآن",
 price:"قيمة الشراء",
 discount:"خصم الشراء",
 tax:"الضريبة",
 profit:"صافي الربح بعد خصم الضريبة",
 total:"المبلغ المسترد نهاية المدة",
 annual:"نسبة العائد السنوي:",
 saved:"حفظ العمليتين",
 assistant:"مساعدك الذكي",
 privacy:"سياسة الخصوصية",
 guide:"دليل أذون الخزانة",
 note:"يتم حفظ آخر عملية تلقائيًا على جهازك.",
 days:"يوم",
 alert:"من فضلك أدخل القيمة الاسمية وسعر العائد.",
 confirm:"من فضلك احسب العملية أولًا."
},

en:{
 language:"العربية",
 title:"Egyptian Treasury Bills Calculator",
 primary:"Primary Market",
 secondary:"Secondary Market",
 nominal:"Nominal Value",
 rate:"Interest Rate (%)",
 calculate:"Calculate Now",
 price:"Purchase Value",
 discount:"Purchase Discount",
 tax:"Tax",
 profit:"Net Profit After Tax",
 total:"Amount Returned at Maturity",
 annual:"Annual Yield:",
 saved:"Save Operations",
 assistant:"Smart Assistant",
 privacy:"Privacy Policy",
 guide:"Treasury Bills Guide",
 note:"The latest operation is saved automatically on your device.",
 days:"Days",
 alert:"Please enter the nominal value and interest rate.",
 confirm:"Please calculate an operation first."
},

fr:{
 language:"العربية",
 title:"Calculateur des bons du Trésor égyptiens",
 primary:"Marché primaire",
 secondary:"Marché secondaire",
 nominal:"Valeur nominale",
 rate:"Taux d'intérêt (%)",
 calculate:"Calculer",
 price:"Valeur d'achat",
 discount:"Escompte d'achat",
 tax:"Impôt",
 profit:"Bénéfice net après impôt",
 total:"Montant remboursé à l'échéance",
 annual:"Rendement annuel :",
 saved:"Enregistrer les opérations",
 assistant:"Assistant intelligent",
 privacy:"Politique de confidentialité",
 guide:"Guide des bons du Trésor",
 note:"La dernière opération est enregistrée automatiquement sur votre appareil.",
 days:"jours",
 alert:"Veuillez saisir la valeur nominale et le taux d'intérêt.",
 confirm:"Veuillez d'abord calculer une opération."
},

it:{
 language:"العربية",
 title:"Calcolatore dei Buoni del Tesoro egiziani",
 primary:"Mercato primario",
 secondary:"Mercato secondario",
 nominal:"Valore nominale",
 rate:"Tasso di interesse (%)",
 calculate:"Calcola ora",
 price:"Valore di acquisto",
 discount:"Sconto di acquisto",
 tax:"Imposta",
 profit:"Utile netto dopo le imposte",
 total:"Importo rimborsato alla scadenza",
 annual:"Rendimento annuo:",
 saved:"Salva operazioni",
 assistant:"Assistente intelligente",
 privacy:"Informativa sulla privacy",
 guide:"Guida ai Buoni del Tesoro",
 note:"L'ultima operazione viene salvata automaticamente sul dispositivo.",
 days:"giorni",
 alert:"Inserisci il valore nominale e il tasso di interesse.",
 confirm:"Calcola prima un'operazione."
},

de:{
 language:"العربية",
 title:"Ägyptischer Schatzwechsel-Rechner",
 primary:"Primärmarkt",
 secondary:"Sekundärmarkt",
 nominal:"Nennwert",
 rate:"Zinssatz (%)",
 calculate:"Jetzt berechnen",
 price:"Kaufwert",
 discount:"Kaufrabatt",
 tax:"Steuer",
 profit:"Nettogewinn nach Steuern",
 total:"Rückzahlungsbetrag bei Fälligkeit",
 annual:"Jährliche Rendite:",
 saved:"Operationen speichern",
 assistant:"Intelligenter Assistent",
 privacy:"Datenschutz",
 guide:"Leitfaden für Schatzwechsel",
 note:"Der letzte Vorgang wird automatisch auf Ihrem Gerät gespeichert.",
 days:"Tage",
 alert:"Bitte Nennwert und Zinssatz eingeben.",
 confirm:"Bitte zuerst eine Berechnung durchführen."
}

};


/* =========================
   القائمة
========================= */

function toggleLanguageMenu(){

 const menu=$("languageMenu");

 menu.classList.toggle("show");

}


/* إغلاق القائمة عند الضغط خارجها */

document.addEventListener("click",function(event){

 const wrap=document.querySelector(".language-wrap");

 if(!wrap.contains(event.target)){

  $("languageMenu").classList.remove("show");

 }

});


/* =========================
   تغيير اللغة
========================= */

function changeLanguage(lang){

 currentLanguage=lang;

 const t=translations[lang];

 document.documentElement.lang=lang;

 document.documentElement.dir=
   lang==="ar" ? "rtl" : "ltr";

 $("languageBtn").textContent=t.language;

 $("title").textContent=t.title;

 $("primaryBtn").textContent=t.primary;

 $("secondaryBtn").textContent=t.secondary;

 $("nominal").placeholder=t.nominal;

 $("rate").placeholder=t.rate;

 $("calculateBtn").textContent=t.calculate;

 $("priceLabel").textContent=t.price;

 $("discountLabel").textContent=t.discount;

 $("taxLabel").textContent=t.tax;

 $("profitLabel").textContent=t.profit;

 $("totalLabel").textContent=t.total;

 $("annualLabel").textContent=t.annual;

 $("savedLink").textContent=t.saved;

 $("assistantLink").textContent=t.assistant;

 $("privacyLink").textContent=t.privacy;

 $("guideLink").textContent=t.guide;

 $("note").textContent=t.note;

 $("languageMenu").classList.remove("show");

 setMarket(currentMarket);

}


/* =========================
   تحويل الأرقام
========================= */

function normalize(value){

 if(!value)return 0;

 const digits={
  "٠":"0",
  "١":"1",
  "٢":"2",
  "٣":"3",
  "٤":"4",
  "٥":"5",
  "٦":"6",
  "٧":"7",
  "٨":"8",
  "٩":"9"
 };

 let text=String(value)
 .replace(/[٠-٩]/g,d=>digits[d])
 .replace(/,/g,"");

 text=text.replace(/[^0-9.]/g,"");

 return parseFloat(text)||0;

}


/* =========================
   علامة الآلاف
========================= */

function formatNominal(input){

 const value=normalize(input.value);

 input.value=value>0
 ?value.toLocaleString("en-US",{maximumFractionDigits:2})
 :"";

}


/* =========================
   تنسيق الأموال
========================= */

function money(value){

 return Number(value||0).toLocaleString(
  "en-US",
  {
   minimumFractionDigits:2,
   maximumFractionDigits:2
  }
 );

}


/* =========================
   السوق والمدد
========================= */

function setMarket(type){

 currentMarket=type;

 $("primaryBtn").classList.toggle(
  "active",
  type==="primary"
 );

 $("secondaryBtn").classList.toggle(
  "active",
  type==="secondary"
 );

 const select=$("days");

 const oldValue=Number(select.value);

 select.innerHTML="";

 let list;

 if(type==="primary"){

  list=[91,182,273,364];

 }else{

  list=Array.from(
   {length:364},
   (_,i)=>i+1
  );

 }

 const t=translations[currentLanguage];

 list.forEach(day=>{

  const option=document.createElement("option");

  option.value=day;

  option.textContent=
   currentLanguage==="ar"
   ?day+" "+t.days
   :day+" "+t.days;

  select.appendChild(option);

 });

 if(list.includes(oldValue)){

  select.value=oldValue;

 }

}


/* =========================
   الحساب
========================= */

function calculate(){

 const P=normalize($("nominal").value);

 const R=
  normalize($("rate").value)/100;

 const D=
  parseInt($("days").value)||0;

 if(P<=0||R<=0||D<=0){

  alert(
   translations[currentLanguage].alert
  );

  return;

 }


 const purchaseValue=
  P/(1+(R*D/365));

 const discount=
  P-purchaseValue;

 const tax=
  discount*.20;

 const netProfit=
  discount-tax;

 const finalAmount=
  purchaseValue+netProfit;

 const annualYield=
  (netProfit/purchaseValue)*
  (365/D)*100;


 $("priceResult").textContent=
  money(purchaseValue);

 $("discountResult").textContent=
  money(discount);

 $("taxResult").textContent=
  money(tax);

 $("profitResult").textContent=
  money(netProfit);

 $("totalResult").textContent=
  money(finalAmount);

 $("annualResult").textContent=
  annualYield.toFixed(2)+"%";


 const operation={

  nominal:P,

  rate:R*100,

  days:D,

  purchaseValue:purchaseValue,

  discount:discount,

  tax:tax,

  netProfit:netProfit,

  finalAmount:finalAmount,

  annualYield:annualYield,

  market:currentMarket,

  date:new Date().toISOString()

 };


 localStorage.setItem(
  "currentOperation",
  JSON.stringify(operation)
 );

 saveCalculatorState();

}


/* =========================
   حفظ الحالة
========================= */

function saveCalculatorState(){

 const state={

  nominal:$("nominal").value,

  rate:$("rate").value,

  days:$("days").value,

  market:currentMarket,

  price:$("priceResult").textContent,

  discount:$("discountResult").textContent,

  tax:$("taxResult").textContent,

  profit:$("profitResult").textContent,

  total:$("totalResult").textContent,

  annual:$("annualResult").textContent

 };

 localStorage.setItem(
  "calculatorState",
  JSON.stringify(state)
 );

}


/* =========================
   استرجاع الحالة
========================= */

function restoreCalculatorState(){

 try{

  const raw=
   localStorage.getItem("calculatorState");

  if(!raw){

   setMarket("primary");

   return;

  }

  const state=JSON.parse(raw);

  setMarket(
   state.market||"primary"
  );

  if(state.days)
   $("days").value=state.days;

  if(state.nominal)
   $("nominal").value=state.nominal;

  if(state.rate)
   $("rate").value=state.rate;

  if(state.price)
   $("priceResult").textContent=state.price;

  if(state.discount)
   $("discountResult").textContent=state.discount;

  if(state.tax)
   $("taxResult").textContent=state.tax;

  if(state.profit)
   $("profitResult").textContent=state.profit;

  if(state.total)
   $("totalResult").textContent=state.total;

  if(state.annual)
   $("annualResult").textContent=state.annual;

 }catch(error){

  setMarket("primary");

 }

}


/* =========================
   قبل مغادرة الصفحة
========================= */

function saveBeforeLeave(){

 saveCalculatorState();

}


/* =========================
   حفظ آخر عمليتين
========================= */

function saveAndOpen(event){

 event.preventDefault();

 saveCalculatorState();

 const current=
  localStorage.getItem(
   "currentOperation"
  );

 if(!current){

  alert(
   translations[currentLanguage].confirm
  );

  return;

 }

 let operations=[];

 try{

  operations=JSON.parse(
   localStorage.getItem(
    "savedOperations"
   )||"[]"
  );

 }catch(error){

  operations=[];

 }

 if(!Array.isArray(operations))
  operations=[];

 operations.unshift(
  JSON.parse(current)
 );

 operations=
  operations.slice(0,2);

 localStorage.setItem(
  "savedOperations",
  JSON.stringify(operations)
 );

 window.location.href=
  "saved.html";

}


/* =========================
   التشغيل
========================= */

window.addEventListener(
 "load",
 restoreCalculatorState
);

window.addEventListener(
 "pageshow",
 restoreCalculatorState
);

</script>

</body>
</html>
