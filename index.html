<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
      maximum-scale=1.0, user-scalable=no,
      viewport-fit=cover">

<title>حاسبة أذون الخزانة المصرية</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
}

body {
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Tahoma,
        Arial,
        sans-serif;

    background:
        linear-gradient(
            145deg,
            #07172b 0%,
            #102d4b 28%,
            #465668 52%,
            #172f4b 72%,
            #06162a 100%
        );

    color: #ffffff;
    overflow-x: hidden;
    touch-action: manipulation;
}

button,
input,
select {
    font-family: inherit;
}

button {
    cursor: pointer;
}

.app {
    width: calc(100% - 12px);
    max-width: 460px;
    min-height: calc(100vh - 12px);

    margin: 6px auto;

    padding: 10px;

    border: 4px solid #e8bd45;
    border-radius: 22px;

    background:
        linear-gradient(
            145deg,
            #102944 0%,
            #253b52 35%,
            #586675 52%,
            #263c53 68%,
            #0c223b 100%
        );

    box-shadow:
        0 0 0 1px rgba(255,255,255,.25) inset,
        0 12px 30px rgba(0,0,0,.35);

    position: relative;
}

/* =========================
   HEADER
========================= */

.header {
    position: relative;
    text-align: center;

    padding:
        45px 4px 13px;

    min-height: 88px;
}

/* مؤشر اللغة */
.language-box {
    position: absolute;
    top: 0;
    left: 0;

    z-index: 10;
}

#languageSelect {
    appearance: none;
    -webkit-appearance: none;

    height: 42px;
    min-width: 110px;

    padding: 0 12px 0 30px;

    border-radius: 13px;

    border: 2px solid #e8bd45;

    background:
        linear-gradient(
            145deg,
            #274765,
            #102d4c
        );

    color: #ffffff;

    font-size: 16px;
    font-weight: 800;

    outline: none;

    text-align: center;

    box-shadow:
        0 3px 8px rgba(0,0,0,.25);
}

.language-box::after {
    content: "▼";

    position: absolute;
    left: 10px;
    top: 12px;

    color: #ffffff;
    font-size: 10px;

    pointer-events: none;
}

/* العنوان */
.title {
    margin: 0;

    color: #ffffff;

    font-size: 21px;
    font-weight: 900;

    line-height: 1.2;

    white-space: nowrap;

    text-align: center;

    text-shadow:
        0 2px 3px rgba(0,0,0,.35);
}

/* =========================
   MARKET BUTTONS
========================= */

.market-switch {
    display: grid;
    grid-template-columns: 1fr 1fr;

    gap: 10px;

    margin-bottom: 12px;
}

.market-btn {
    height: 58px;

    border-radius: 16px;

    border: 3px solid #e8bd45;

    background:
        linear-gradient(
            145deg,
            #1d3854,
            #30485e
        );

    color: #ffffff;

    font-size: 20px;
    font-weight: 900;

    box-shadow:
        inset 0 1px 2px rgba(255,255,255,.18),
        0 3px 8px rgba(0,0,0,.25);
}

.market-btn.active {
    background:
        linear-gradient(
            145deg,
            #ffe27b,
            #e7bc3e
        );

    color: #102d4d;

    box-shadow:
        inset 0 1px 2px rgba(255,255,255,.45),
        0 3px 8px rgba(0,0,0,.25);
}

/* =========================
   INPUTS
========================= */

.fields {
    display: flex;
    flex-direction: column;

    gap: 10px;

    margin-bottom: 12px;
}

.input-wrap {
    width: 100%;
}

.input-wrap input,
.input-wrap select {
    width: 100%;
    height: 58px;

    border-radius: 16px;

    border: 3px solid #e8bd45;

    background:
        linear-gradient(
            145deg,
            #526273,
            #34495e
        );

    color: #ffffff;

    font-size: 20px;
    font-weight: 700;

    outline: none;

    box-shadow:
        inset 0 1px 3px rgba(0,0,0,.3),
        0 2px 6px rgba(0,0,0,.18);
}

/* الأرقام تبدأ من اليمين */
.input-wrap input {
    direction: rtl;
    text-align: right;

    padding: 0 18px;
}

.input-wrap input::placeholder {
    color: #e7ebef;
    opacity: .95;
}

.input-wrap select {
    direction: rtl;
    text-align: right;

    padding: 0 18px;

    appearance: auto;
    -webkit-appearance: auto;
}

.input-wrap input:focus,
.input-wrap select:focus {
    border-color: #ffd45d;

    box-shadow:
        0 0 0 2px rgba(232,189,69,.18),
        inset 0 1px 3px rgba(0,0,0,.3);
}

/* =========================
   CALCULATE BUTTON
========================= */

.calculate-btn {
    width: 100%;
    height: 62px;

    margin-bottom: 14px;

    border-radius: 17px;

    border: 3px solid #e8bd45;

    background:
        linear-gradient(
            145deg,
            #24527d,
            #0a2949 48%,
            #123e63
        );

    color: #ffffff;

    font-size: 23px;
    font-weight: 900;

    box-shadow:
        inset 0 1px 3px rgba(255,255,255,.22),
        0 5px 10px rgba(0,0,0,.28);
}

.calculate-btn:active {
    transform: scale(.985);
}

/* =========================
   RESULTS
========================= */

.results-grid {
    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 10px;

    margin-bottom: 10px;
}

.result-card {
    min-height: 104px;

    border-radius: 17px;

    border: 2px solid #e8bd45;

    background:
        linear-gradient(
            145deg,
            #52616f,
            #354757
        );

    display: flex;
    flex-direction: column;

    align-items: center;
    justify-content: center;

    text-align: center;

    padding: 10px 6px;

    box-shadow:
        inset 0 1px 2px rgba(255,255,255,.14),
        0 3px 7px rgba(0,0,0,.20);
}

.result-label {
    color: #ffffff;

    font-size: 16px;
    font-weight: 700;

    line-height: 1.25;

    margin-bottom: 7px;
}

.result-value {
    color: #ffd447;

    font-size: 25px;
    font-weight: 900;

    line-height: 1.1;
}

/* =========================
   MATURITY RESULT
========================= */

.total {
    width: 100%;

    min-height: 135px;

    margin-bottom: 10px;

    border-radius: 18px;

    border: 3px solid #e8bd45;

    background:
        linear-gradient(
            145deg,
            #1c466c,
            #294d6c 45%,
            #1a3855
        );

    display: flex;
    flex-direction: column;

    align-items: center;
    justify-content: center;

    text-align: center;

    padding: 12px;

    box-shadow:
        inset 0 1px 3px rgba(255,255,255,.15),
        0 4px 9px rgba(0,0,0,.25);
}

.total-label {
    color: #ffffff;

    font-size: 18px;
    font-weight: 800;

    margin-bottom: 5px;
}

.total-value {
    color: #ffd447;

    font-size: 31px;
    font-weight: 900;

    line-height: 1.15;

    margin-bottom: 5px;
}

.annual {
    color: #ffffff;

    font-size: 16px;
    font-weight: 700;
}

.annual span {
    color: #ffd447;
}

/* =========================
   ACTION BUTTONS
========================= */

.actions {
    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 10px;

    margin-bottom: 10px;
}

.action-btn {
    height: 58px;

    border-radius: 16px;

    border: 3px solid #e8bd45;

    background:
        linear-gradient(
            145deg,
            #52616f,
            #34495b
        );

    color: #ffffff;

    font-size: 17px;
    font-weight: 900;

    box-shadow:
        inset 0 1px 2px rgba(255,255,255,.14),
        0 3px 7px rgba(0,0,0,.22);
}

.action-btn.primary {
    background:
        linear-gradient(
            145deg,
            #24547f,
            #0d2c4c
        );
}

.action-btn:active {
    transform: scale(.985);
}

/* =========================
   FOOTER
========================= */

.footer {
    border-top: 2px solid #e8bd45;

    margin-top: 2px;

    padding-top: 8px;
    padding-bottom: 2px;

    text-align: center;
}

.footer-links {
    display: flex;

    justify-content: center;
    align-items: center;

    gap: 12px;

    flex-wrap: wrap;
}

.footer a {
    color: #ffffff;

    text-decoration: none;

    font-size: 14px;
    font-weight: 700;
}

.footer a:hover {
    color: #ffd447;
}

.separator {
    color: #e8bd45;

    font-weight: 900;
}

.developer {
    margin-top: 6px;

    color: #ffffff;

    font-size: 14px;
    font-weight: 700;
}

/* =========================
   RESPONSIVE
========================= */

@media (max-width: 380px) {

    .app {
        padding: 8px;
    }

    .title {
        font-size: 18px;
    }

    #languageSelect {
        min-width: 96px;
        height: 39px;
        font-size: 14px;
    }

    .market-btn {
        font-size: 17px;
        height: 53px;
    }

    .input-wrap input,
    .input-wrap select {
        height: 54px;
        font-size: 18px;
    }

    .calculate-btn {
        height: 58px;
        font-size: 21px;
    }

    .result-label {
        font-size: 14px;
    }

    .result-value {
        font-size: 22px;
    }

    .total-value {
        font-size: 27px;
    }

    .action-btn {
        font-size: 15px;
    }
}

/* اللغة الألمانية تحتاج حجمًا أصغر حتى يظل العنوان سطرًا واحدًا */
html[lang="de"] .title {
    font-size: 18px;
}

html[lang="fr"] .title {
    font-size: 19px;
}

html[lang="it"] .title {
    font-size: 18px;
}

/* =========================
   LTR
========================= */

html[dir="ltr"] .input-wrap input {
    direction: rtl;
    text-align: right;
}

html[dir="ltr"] .input-wrap select {
    direction: ltr;
    text-align: left;
}

/* =========================
   NO ZOOM
========================= */

input,
select,
button {
    touch-action: manipulation;
}
</style>
</head>

<body>

<div class="app">

    <!-- HEADER -->
    <header class="header">

        <div class="language-box">
            <select id="languageSelect" aria-label="Language">
                <option value="ar">العربية</option>
                <option value="en">English</option>
                <option value="fr">Français</option>
                <option value="it">Italiano</option>
                <option value="de">Deutsch</option>
            </select>
        </div>

        <h1 class="title" id="title">
            حاسبة أذون الخزانة المصرية
        </h1>

    </header>


    <!-- MARKET -->
    <div class="market-switch">

        <button
            type="button"
            class="market-btn active"
            id="primaryBtn"
            onclick="setMarket('primary')">
            السوق الأولي
        </button>

        <button
            type="button"
            class="market-btn"
            id="secondaryBtn"
            onclick="setMarket('secondary')">
            السوق الثانوي
        </button>

    </div>


    <!-- INPUTS -->
    <div class="fields">

        <div class="input-wrap">
            <input
                type="text"
                id="nominal"
                inputmode="decimal"
                autocomplete="off"
                placeholder="القيمة الاسمية">
        </div>

        <div class="input-wrap">
            <input
                type="text"
                id="rate"
                inputmode="decimal"
                autocomplete="off"
                placeholder="سعر العائد (%)">
        </div>

        <div class="input-wrap">
            <select id="days"></select>
        </div>

    </div>


    <!-- CALCULATE -->
    <button
        type="button"
        class="calculate-btn"
        id="calculateBtn"
        onclick="calculate()">
        احسب الآن
    </button>


    <!-- RESULTS 2 x 2 -->
    <div class="results-grid">

        <div class="result-card">
            <div class="result-label" id="purchaseLabel">
                قيمة الشراء
            </div>
            <div class="result-value" id="purchaseValue">
                0.00
            </div>
        </div>

        <div class="result-card">
            <div class="result-label" id="discountLabel">
                خصم الشراء
            </div>
            <div class="result-value" id="discountValue">
                0.00
            </div>
        </div>

        <div class="result-card">
            <div class="result-label" id="taxLabel">
                الضريبة
            </div>
            <div class="result-value" id="taxValue">
                0.00
            </div>
        </div>

        <div class="result-card">
            <div class="result-label" id="profitLabel">
                صافي الربح بعد خصم الضريبة
            </div>
            <div class="result-value" id="profitValue">
                0.00
            </div>
        </div>

    </div>


    <!-- MATURITY -->
    <div class="total">

        <div class="total-label" id="totalLabel">
            المبلغ المسترد نهاية المدة
        </div>

        <div class="total-value" id="totalValue">
            0.00
        </div>

        <div class="annual">
            <span id="annualLabel">نسبة العائد السنوي:</span>
            <span id="annualValue">0.00%</span>
        </div>

    </div>


    <!-- ACTIONS -->
    <div class="actions">

        <button
            type="button"
            class="action-btn"
            onclick="saveOperations()"
            id="saveBtn">
            حفظ العمليتين
        </button>

        <button
            type="button"
            class="action-btn primary"
            onclick="openAssistant()"
            id="assistantBtn">
            مساعدك الذكي
        </button>

    </div>


    <!-- FOOTER -->
    <footer class="footer">

        <div class="footer-links">

            <a href="privacy.html" id="privacyLink">
                سياسة الخصوصية
            </a>

            <span class="separator">|</span>

            <a href="about.html" id="guideLink">
                دليل أذون الخزانة
            </a>

        </div>

        <div class="developer" id="developer">
            أ/ طارق متولي
        </div>

    </footer>

</div>


<script>
/* =====================================================
   TRANSLATIONS
===================================================== */

const translations = {

    ar: {
        title: "حاسبة أذون الخزانة المصرية",

        primary: "السوق الأولي",
        secondary: "السوق الثانوي",

        nominal: "القيمة الاسمية",
        rate: "سعر العائد (%)",

        calculate: "احسب الآن",

        purchase: "قيمة الشراء",
        discount: "خصم الشراء",
        tax: "الضريبة",
        profit: "صافي الربح بعد خصم الضريبة",

        total: "المبلغ المسترد نهاية المدة",
        annual: "نسبة العائد السنوي:",

        save: "حفظ العمليتين",
        assistant: "مساعدك الذكي",

        privacy: "سياسة الخصوصية",
        guide: "دليل أذون الخزانة",

        days: "يوم"
    },

    en: {
        title: "Egyptian Treasury Bills Calculator",

        primary: "Primary Market",
        secondary: "Secondary Market",

        nominal: "Nominal Value",
        rate: "Interest Rate (%)",

        calculate: "Calculate Now",

        purchase: "Purchase Value",
        discount: "Purchase Discount",
        tax: "Tax",
        profit: "Net Profit After Tax",

        total: "Amount Returned at Maturity",
        annual: "Annual Yield:",

        save: "Save Operations",
        assistant: "Smart Assistant",

        privacy: "Privacy Policy",
        guide: "Treasury Bills Guide",

        days: "days"
    },

    fr: {
        title: "Calculateur de bons du Trésor égyptiens",

        primary: "Marché primaire",
        secondary: "Marché secondaire",

        nominal: "Valeur nominale",
        rate: "Taux d’intérêt (%)",

        calculate: "Calculer maintenant",

        purchase: "Valeur d’achat",
        discount: "Décote d’achat",
        tax: "Impôt",
        profit: "Bénéfice net après impôt",

        total: "Montant remboursé à l’échéance",
        annual: "Rendement annuel :",

        save: "Enregistrer les 2 opérations",
        assistant: "Assistant intelligent",

        privacy: "Politique de confidentialité",
        guide: "Guide des bons du Trésor",

        days: "jours"
    },

    it: {
        title: "Calcolatore dei Buoni del Tesoro egiziani",

        primary: "Mercato primario",
        secondary: "Mercato secondario",

        nominal: "Valore nominale",
        rate: "Tasso di rendimento (%)",

        calculate: "Calcola ora",

        purchase: "Valore di acquisto",
        discount: "Sconto di acquisto",
        tax: "Imposta",
        profit: "Profitto netto dopo le imposte",

        total: "Importo rimborsato alla scadenza",
        annual: "Rendimento annuo:",

        save: "Salva le 2 operazioni",
        assistant: "Assistente intelligente",

        privacy: "Informativa sulla privacy",
        guide: "Guida ai Buoni del Tesoro",

        days: "giorni"
    },

    de: {
        title: "Ägyptischer Schatzwechsel-Rechner",

        primary: "Primärmarkt",
        secondary: "Sekundärmarkt",

        nominal: "Nennwert",
        rate: "Rendite (%)",

        calculate: "Jetzt berechnen",

        purchase: "Kaufwert",
        discount: "Kaufabschlag",
        tax: "Steuer",
        profit: "Nettogewinn nach Steuern",

        total: "Rückzahlungsbetrag bei Fälligkeit",
        annual: "Jährliche Rendite:",

        save: "2 Vorgänge speichern",
        assistant: "Intelligenter Assistent",

        privacy: "Datenschutzerklärung",
        guide: "Leitfaden für Schatzwechsel",

        days: "Tage"
    }
};


/* =====================================================
   VARIABLES
===================================================== */

let currentLanguage =
    localStorage.getItem("calculatorLanguage") || "ar";

let currentMarket =
    localStorage.getItem("calculatorMarket") || "primary";


/* =====================================================
   ELEMENTS
===================================================== */

const languageSelect =
    document.getElementById("languageSelect");

const nominalInput =
    document.getElementById("nominal");

const rateInput =
    document.getElementById("rate");

const daysSelect =
    document.getElementById("days");


/* =====================================================
   FORMAT NUMBER
===================================================== */

function formatNumber(value) {

    if (value === "" || value === null || value === undefined) {
        return "";
    }

    let cleaned =
        String(value)
        .replace(/,/g, "")
        .replace(/[^\d.]/g, "");

    if (!cleaned) {
        return "";
    }

    let parts = cleaned.split(".");

    let integerPart =
        parts[0] || "0";

    let decimalPart =
        parts.length > 1
            ? "." + parts[1].slice(0, 3)
            : "";

    integerPart =
        Number(integerPart).toLocaleString("en-US");

    return integerPart + decimalPart;
}


/* =====================================================
   NOMINAL INPUT
===================================================== */

nominalInput.addEventListener("input", function () {

    let cursor =
        this.selectionStart;

    let oldLength =
        this.value.length;

    this.value =
        formatNumber(this.value);

    let newLength =
        this.value.length;

    cursor +=
        newLength - oldLength;

    try {
        this.setSelectionRange(cursor, cursor);
    } catch (e) {}
});


/* =====================================================
   DAYS
===================================================== */

function updateDays() {

    let previous =
        parseInt(daysSelect.value) || 91;

    daysSelect.innerHTML = "";

    if (currentMarket === "primary") {

        [91, 182, 273, 364].forEach(day => {

            const option =
                document.createElement("option");

            option.value = day;

            option.textContent =
                day + " " +
                translations[currentLanguage].days;

            daysSelect.appendChild(option);
        });

        if ([91,182,273,364].includes(previous)) {
            daysSelect.value = previous;
        } else {
            daysSelect.value = 91;
        }

    } else {

        for (let day = 1; day <= 364; day++) {

            const option =
                document.createElement("option");

            option.value = day;

            option.textContent =
                day + " " +
                translations[currentLanguage].days;

            daysSelect.appendChild(option);
        }

        if (previous >= 1 && previous <= 364) {
            daysSelect.value = previous;
        } else {
            daysSelect.value = 1;
        }
    }
}


/* =====================================================
   MARKET
===================================================== */

function setMarket(market) {

    currentMarket = market;

    localStorage.setItem(
        "calculatorMarket",
        currentMarket
    );

    document
        .getElementById("primaryBtn")
        .classList.toggle(
            "active",
            market === "primary"
        );

    document
        .getElementById("secondaryBtn")
        .classList.toggle(
            "active",
            market === "secondary"
        );

    updateDays();
}


/* =====================================================
   TRANSLATE
===================================================== */

function translatePage() {

    const t =
        translations[currentLanguage];

    document.documentElement.lang =
        currentLanguage;

    document.documentElement.dir =
        currentLanguage === "ar"
            ? "rtl"
            : "ltr";

    document.title =
        t.title;

    document.getElementById("title").textContent =
        t.title;

    document.getElementById("primaryBtn").textContent =
        t.primary;

    document.getElementById("secondaryBtn").textContent =
        t.secondary;

    nominalInput.placeholder =
        t.nominal;

    rateInput.placeholder =
        t.rate;

    document.getElementById("calculateBtn").textContent =
        t.calculate;

    document.getElementById("purchaseLabel").textContent =
        t.purchase;

    document.getElementById("discountLabel").textContent =
        t.discount;

    document.getElementById("taxLabel").textContent =
        t.tax;

    document.getElementById("profitLabel").textContent =
        t.profit;

    document.getElementById("totalLabel").textContent =
        t.total;

    document.getElementById("annualLabel").textContent =
        t.annual;

    document.getElementById("saveBtn").textContent =
        t.save;

    document.getElementById("assistantBtn").textContent =
        t.assistant;

    document.getElementById("privacyLink").textContent =
        t.privacy;

    document.getElementById("guideLink").textContent =
        t.guide;

    updateDays();
}


/* =====================================================
   LANGUAGE CHANGE
===================================================== */

languageSelect.value =
    currentLanguage;

languageSelect.addEventListener(
    "change",
    function () {

        currentLanguage =
            this.value;

        localStorage.setItem(
            "calculatorLanguage",
            currentLanguage
        );

        translatePage();
    }
);


/* =====================================================
   CALCULATE
===================================================== */

function calculate() {

    let nominal =
        parseFloat(
            nominalInput.value.replace(/,/g, "")
        );

    let rate =
        parseFloat(rateInput.value);

    let days =
        parseInt(daysSelect.value);

    if (
        isNaN(nominal) ||
        nominal <= 0 ||
        isNaN(rate) ||
        rate < 0 ||
        isNaN(days) ||
        days <= 0
    ) {

        alert(
            currentLanguage === "ar"
                ? "برجاء إدخال البيانات المطلوبة."
                : "Please enter the required data."
        );

        return;
    }

    /* السعر / قيمة الشراء */
    let purchase =
        nominal /
        (1 + (rate / 100) * (days / 365));

    /* خصم الشراء */
    let discount =
        nominal - purchase;

    /* الضريبة 20% */
    let tax =
        discount * 0.20;

    /* صافي الربح */
    let netProfit =
        discount - tax;

    /* المبلغ المسترد */
    let total =
        purchase + netProfit;

    /* العائد السنوي */
    let annualYield =
        (netProfit / purchase) *
        (365 / days) *
        100;

    document.getElementById("purchaseValue").textContent =
        formatMoney(purchase);

    document.getElementById("discountValue").textContent =
        formatMoney(discount);

    document.getElementById("taxValue").textContent =
        formatMoney(tax);

    document.getElementById("profitValue").textContent =
        formatMoney(netProfit);

    document.getElementById("totalValue").textContent =
        formatMoney(total);

    document.getElementById("annualValue").textContent =
        annualYield.toFixed(2) + "%";


    saveLastOperation({
        market: currentMarket,
        nominal: nominal,
        rate: rate,
        days: days,

        purchase: purchase,
        discount: discount,
        tax: tax,
        netProfit: netProfit,
        total: total,
        annualYield: annualYield,

        date: new Date().toLocaleString()
    });
}


/* =====================================================
   MONEY FORMAT
===================================================== */

function formatMoney(value) {

    return Number(value).toLocaleString(
        "en-US",
        {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
        }
    );
}


/* =====================================================
   SAVE LAST OPERATION
===================================================== */

function saveLastOperation(operation) {

    localStorage.setItem(
        "lastTreasuryOperation",
        JSON.stringify(operation)
    );
}
