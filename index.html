<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#12385f">
<title>حاسبة أذون الخزانة المصرية</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  background:#edf3f8;
  font-family:Tahoma,Arial,sans-serif;
}

body{
  color:#12385f;
  overflow-x:hidden;
  touch-action:pan-y;
}

.app{
  width:calc(100% - 12px);
  max-width:460px;
  min-height:calc(100vh - 12px);
  margin:6px auto;
  background:#fff;
  border:2px solid #e8bd45;
  border-radius:20px;
  box-shadow:0 5px 20px rgba(18,56,95,.16);
  padding:10px;
  display:flex;
  flex-direction:column;
}

.header{
  position:relative;
  text-align:center;
  padding:5px 0 10px;
}

.title{
  color:#12385f;
  font-size:22px;
  font-weight:900;
  line-height:1.3;
}

.language{
  position:absolute;
  left:0;
  top:0;
  border:1px solid #e8bd45;
  background:#12385f;
  color:#fff;
  border-radius:8px;
  padding:6px 9px;
  font-size:11px;
  font-weight:bold;
}

.market{
  display:flex;
  gap:8px;
  margin-bottom:9px;
}

.market button{
  flex:1;
  height:46px;
  border:2px solid #12385f;
  border-radius:11px;
  background:#fff;
  color:#12385f;
  font-size:15px;
  font-weight:900;
}

.market button.active{
  background:#f4d36b;
  border-color:#e8bd45;
  color:#12385f;
}

.field{
  width:100%;
  height:48px;
  margin:4px 0;
  border:2px solid #d2dce7;
  border-radius:10px;
  background:#fff;
  color:#12385f;
  font-size:17px;
  font-weight:bold;
  padding:8px 12px;
  outline:none;
}

.field:focus{
  border-color:#e8bd45;
  box-shadow:0 0 0 2px rgba(232,189,69,.18);
}

input{
  direction:rtl;
  text-align:right;
  unicode-bidi:plaintext;
}

input::placeholder{
  color:#6d7c8c;
  opacity:1;
}

select{
  direction:rtl;
  text-align:right;
}

.calculate{
  width:100%;
  height:50px;
  margin:8px 0;
  border:0;
  border-radius:11px;
  background:#12385f;
  color:#fff;
  font-size:18px;
  font-weight:900;
  box-shadow:0 3px 8px rgba(18,56,95,.18);
}

.calculate:active{
  transform:scale(.99);
}

.results{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
  margin-top:2px;
}

.result-card{
  min-height:82px;
  border-radius:13px;
  padding:9px 7px;
  text-align:center;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  border:1px solid rgba(18,56,95,.08);
}

.result-card span{
  color:#12385f;
  font-size:12px;
  font-weight:900;
  line-height:1.4;
}

.result-card strong{
  color:#12385f;
  font-family:Arial,sans-serif;
  font-size:17px;
  font-weight:900;
  margin-top:5px;
  direction:ltr;
  unicode-bidi:plaintext;
}

.purchase{
  background:#fff1cf;
}

.discount{
  background:#dceaff;
}

.tax{
  background:#dff5ea;
}

.profit{
  background:#dff5ea;
}

.total{
  margin-top:9px;
  border:2px solid #e8bd45;
  border-radius:13px;
  background:#f5f9fc;
  text-align:center;
  padding:9px;
}

.total-label{
  color:#12385f;
  font-size:13px;
  font-weight:900;
}

.total-value{
  color:#12385f;
  font-family:Arial,sans-serif;
  font-size:22px;
  font-weight:900;
  margin-top:4px;
  direction:ltr;
  unicode-bidi:plaintext;
}

.annual{
  color:#12385f;
  font-size:12px;
  font-weight:bold;
  margin-top:4px;
}

.annual strong{
  font-family:Arial,sans-serif;
  font-size:14px;
}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:9px;
}

.action{
  height:46px;
  border:2px solid #12385f;
  border-radius:10px;
  background:#fff;
  color:#12385f;
  display:flex;
  align-items:center;
  justify-content:center;
  text-decoration:none;
  font-size:14px;
  font-weight:900;
  text-align:center;
}

.action.primary{
  background:#12385f;
  color:#fff;
  border-color:#12385f;
}

.note{
  text-align:center;
  color:#6d7c8c;
  font-size:10px;
  line-height:1.5;
  margin:6px 0 2px;
}

.footer{
  margin-top:auto;
  padding-top:7px;
  border-top:1px solid #dbe3eb;
  text-align:center;
  font-size:11px;
  line-height:1.8;
}

.footer a{
  color:#12385f;
  text-decoration:none;
  font-weight:bold;
}

.developer{
  color:#6d7c8c;
}

@media(max-width:360px){

  .app{
    padding:8px;
  }

  .title{
    font-size:20px;
  }

  .market button{
    font-size:13px;
    height:44px;
  }

  .field{
    height:46px;
    font-size:16px;
  }

  .result-card{
    min-height:76px;
  }

  .result-card span{
    font-size:11px;
  }

  .result-card strong{
    font-size:15px;
  }

  .total-value{
    font-size:20px;
  }

  .action{
    font-size:12px;
  }
}
</style>
</head>

<body>

<div class="app">

  <header class="header">
    <button class="language" id="languageBtn" type="button" onclick="toggleLanguage()">
      English
    </button>

    <div class="title" id="title">
      حاسبة أذون الخزانة المصرية
    </div>
  </header>

  <div class="market">
    <button id="primaryBtn"
            class="active"
            type="button"
            onclick="setMarket('primary')">
      السوق الأولي
    </button>

    <button id="secondaryBtn"
            type="button"
            onclick="setMarket('secondary')">
      السوق الثانوي
    </button>
  </div>

  <input
    class="field"
    id="nominal"
    type="text"
    inputmode="decimal"
    autocomplete="off"
    placeholder="القيمة الاسمية"
    oninput="formatNominal(this)"
  >

  <input
    class="field"
    id="rate"
    type="text"
    inputmode="decimal"
    autocomplete="off"
    placeholder="سعر العائد (%)"
  >

  <select class="field" id="days"></select>

  <button class="calculate" id="calculateBtn" type="button" onclick="calculate()">
    احسب الآن
  </button>

  <!-- ٤ مربعات فقط: مربعين فوق ومربعين تحت -->
  <div class="results">

    <div class="result-card purchase">
      <span id="priceLabel">قيمة الشراء</span>
      <strong id="priceResult">0.00</strong>
    </div>

    <div class="result-card discount">
      <span id="discountLabel">خصم الشراء</span>
      <strong id="discountResult">0.00</strong>
    </div>

    <div class="result-card tax">
      <span id="taxLabel">الضريبة</span>
      <strong id="taxResult">0.00</strong>
    </div>

    <div class="result-card profit">
      <span id="profitLabel">صافي الربح بعد خصم الضريبة</span>
      <strong id="profitResult">0.00</strong>
    </div>

  </div>

  <!-- المبلغ المسترد شريط مستقل وليس مربع نتيجة خامس -->
  <div class="total">
    <div class="total-label" id="totalLabel">
      المبلغ المسترد نهاية المدة
    </div>

    <div class="total-value" id="totalResult">
      0.00
    </div>

    <div class="annual">
      <span id="annualLabel">نسبة العائد السنوي:</span>
      <strong id="annualResult">0.00%</strong>
    </div>
  </div>

  <div class="actions">

    <a
      class="action"
      href="saved.html"
      id="savedLink"
      onclick="saveAndOpen(event)"
    >
      حفظ العمليتين
    </a>

    <a
      class="action primary"
      href="assistant.html"
      id="assistantLink"
      onclick="saveBeforeLeave()"
    >
      مساعدك الذكي
    </a>

  </div>

  <div class="note" id="note">
    يتم حفظ آخر عملية تلقائيًا على جهازك.
  </div>

  <footer class="footer">

    <a href="privacy.html" id="privacyLink">
      سياسة الخصوصية
    </a>

    <span> | </span>

    <a href="about.html" id="guideLink">
      دليل أذون الخزانة
    </a>

    <div class="developer">
      أ/ طارق متولي
    </div>

  </footer>

</div>

<script>

let isArabic = true;
let currentMarket = "primary";

const $ = id => document.getElementById(id);


/* تحويل الأرقام العربية إلى إنجليزية */
function normalize(value){

  if(!value) return 0;

  const arabicDigits = {
    "٠":"0",
    "١":"1",
    "٢":"2",
    "٣":"3",
    "٤":"4",
    "٥":"5",
    "٦":"6",
    "٧":"7",
    "٨":"8",
    "٩":"9"
  };

  let text = String(value)
    .replace(/[٠-٩]/g, d => arabicDigits[d])
    .replace(/,/g,"");

  text = text.replace(/[^0-9.]/g,"");

  return parseFloat(text) || 0;
}


/* علامة الآلاف */
function formatNominal(input){

  const value = normalize(input.value);

  if(value > 0){

    input.value = value.toLocaleString("en-US",{
      maximumFractionDigits:2
    });

  }else{

    input.value = "";

  }

}


/* تنسيق الأموال */
function money(value){

  return Number(value || 0).toLocaleString("en-US",{
    minimumFractionDigits:2,
    maximumFractionDigits:2
  });

}


/* إنشاء مدد الأذون */
function setMarket(type){

  currentMarket = type;

  $("primaryBtn").classList.toggle(
    "active",
    type === "primary"
  );

  $("secondaryBtn").classList.toggle(
    "active",
    type === "secondary"
  );

  const select = $("days");

  const oldValue = Number(select.value);

  select.innerHTML = "";

  let list;

  if(type === "primary"){

    list = [91,182,273,364];

  }else{

    list = Array.from(
      {length:364},
      (_,i) => i + 1
    );

  }

  list.forEach(day => {

    const option = document.createElement("option");

    option.value = day;

    option.textContent =
      isArabic
      ? day + " يوم"
      : day + " Days";

    select.appendChild(option);

  });

  if(list.includes(oldValue)){

    select.value = oldValue;

  }

}


/* الحساب */
function calculate(){

  const P = normalize($("nominal").value);

  const R = normalize($("rate").value) / 100;

  const D = parseInt($("days").value) || 0;

  if(P <= 0 || R <= 0 || D <= 0){

    alert(
      isArabic
      ? "من فضلك أدخل القيمة الاسمية وسعر العائد."
      : "Please enter the nominal value and rate."
    );

    return;

  }

  /*
    قيمة الشراء
    = القيمة الاسمية ÷
      (1 + سعر العائد × المدة ÷ 365)
  */

  const purchaseValue =
    P / (1 + (R * D / 365));

  const discount =
    P - purchaseValue;

  const tax =
    discount * 0.20;

  const netProfit =
    discount - tax;

  const finalAmount =
    purchaseValue + netProfit;

  const annualYield =
    (netProfit / purchaseValue) *
    (365 / D) *
    100;


  $("priceResult").textContent =
    money(purchaseValue);

  $("discountResult").textContent =
    money(discount);

  $("taxResult").textContent =
    money(tax);

  $("profitResult").textContent =
    money(netProfit);

  $("totalResult").textContent =
    money(finalAmount);

  $("annualResult").textContent =
    annualYield.toFixed(2) + "%";


  const operation = {

    nominal:P,

    rate:R * 100,

    days:D,

    purchaseValue:purchaseValue,

    discount:discount,

    tax:tax,

    netProfit:netProfit,

    finalAmount:finalAmount,

    annualYield:annualYield,

    market:currentMarket,

    date:new Date().toISOString()

  };


  localStorage.setItem(
    "currentOperation",
    JSON.stringify(operation)
  );

  saveCalculatorState();

}


/* حفظ حالة الحاسبة */
function saveCalculatorState(){

  const state = {

    nominal:$("nominal").value,

    rate:$("rate").value,

    days:$("days").value,

    market:currentMarket,

    price:$("priceResult").textContent,

    discount:$("discountResult").textContent,

    tax:$("taxResult").textContent,

    profit:$("profitResult").textContent,

    total:$("totalResult").textContent,

    annual:$("annualResult").textContent

  };

  localStorage.setItem(
    "calculatorState",
    JSON.stringify(state)
  );

}


/* استرجاع آخر حالة */
function restoreCalculatorState(){

  try{

    const raw =
      localStorage.getItem("calculatorState");

    if(!raw){

      setMarket("primary");

      return;

    }

    const state =
      JSON.parse(raw);

    if(state.market){

      setMarket(state.market);

    }else{

      setMarket("primary");

    }

    if(state.days)
      $("days").value = state.days;

    if(state.nominal)
      $("nominal").value = state.nominal;

    if(state.rate)
      $("rate").value = state.rate;

    if(state.price)
      $("priceResult").textContent = state.price;

    if(state.discount)
      $("discountResult").textContent = state.discount;

    if(state.tax)
      $("taxResult").textContent = state.tax;

    if(state.profit)
      $("profitResult").textContent = state.profit;

    if(state.total)
      $("totalResult").textContent = state.total;

    if(state.annual)
      $("annualResult").textContent = state.annual;

  }catch(error){

    setMarket("primary");

  }

}


/* حفظ قبل الانتقال */
function saveBeforeLeave(){

  saveCalculatorState();

}


/* حفظ آخر عمليتين */
function saveAndOpen(event){

  event.preventDefault();

  saveCalculatorState();

  const current =
    localStorage.getItem("currentOperation");

  if(!current){

    alert(
      isArabic
      ? "من فضلك احسب العملية أولًا."
      : "Please calculate an operation first."
    );

    return;

  }

  let operations = [];

  try{

    operations =
      JSON.parse(
        localStorage.getItem("savedOperations") || "[]"
      );

  }catch(error){

    operations = [];

  }

  if(!Array.isArray(operations)){

    operations = [];

  }

  try{

    operations.unshift(
      JSON.parse(current)
    );

    operations =
      operations.slice(0,2);

    localStorage.setItem(
      "savedOperations",
      JSON.stringify(operations)
    );

  }catch(error){}

  window.location.href = "saved.html";

}


/* اللغات */
function toggleLanguage(){

  isArabic = !isArabic;

  document.documentElement.lang =
    isArabic ? "ar" : "en";

  document.documentElement.dir =
    isArabic ? "rtl" : "ltr";


  $("languageBtn").textContent =
    isArabic ? "English" : "العربية";


  $("title").textContent =
    isArabic
    ? "حاسبة أذون الخزانة المصرية"
    : "Egyptian Treasury Bills Calculator";


  $("primaryBtn").textContent =
    isArabic
    ? "السوق الأولي"
    : "Primary Market";


  $("secondaryBtn").textContent =
    isArabic
    ? "السوق الثانوي"
    : "Secondary Market";


  $("nominal").placeholder =
    isArabic
    ? "القيمة الاسمية"
    : "Nominal Value";


  $("rate").placeholder =
    isArabic
    ? "سعر العائد (%)"
    : "Interest Rate (%)";


  $("calculateBtn").textContent =
    isArabic
    ? "احسب الآن"
    : "Calculate Now";


  $("priceLabel").textContent =
    isArabic
    ? "قيمة الشراء"
    : "Purchase Value";


  $("discountLabel").textContent =
    isArabic
    ? "خصم الشراء"
    : "Purchase Discount";


  $("taxLabel").textContent =
    isArabic
    ? "الضريبة"
    : "Tax";


  $("profitLabel").textContent =
    isArabic
    ? "صافي الربح بعد خصم الضريبة"
    : "Net Profit After Tax";


  $("totalLabel").textContent =
    isArabic
    ? "المبلغ المسترد نهاية المدة"
    : "Amount Returned at Maturity";


  $("annualLabel").textContent =
    isArabic
    ? "نسبة العائد السنوي:"
    : "Annual Yield:";


  $("savedLink").textContent =
    isArabic
    ? "حفظ العمليتين"
    : "Save Operations";


  $("assistantLink").textContent =
    isArabic
    ? "مساعدك الذكي"
    : "Smart Assistant";


  $("privacyLink").textContent =
    isArabic
    ? "سياسة الخصوصية"
    : "Privacy Policy";


  $("guideLink").textContent =
    isArabic
    ? "دليل أذون الخزانة"
    : "Treasury Bills Guide";


  $("note").textContent =
    isArabic
    ? "يتم حفظ آخر عملية تلقائيًا على جهازك."
    : "The latest operation is saved automatically on your device.";


  setMarket(currentMarket);

}


/* بدء التشغيل */
window.addEventListener(
  "load",
  restoreCalculatorState
);

window.addEventListener(
  "pageshow",
  restoreCalculatorState
);

</script>

</body>
</html>
