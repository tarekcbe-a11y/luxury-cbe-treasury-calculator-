<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>المساعد الذكي</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
}

body{
    font-family:
        "Geeza Pro",
        "Avenir Next",
        -apple-system,
        BlinkMacSystemFont,
        sans-serif;

    background:
        radial-gradient(circle at 50% 8%,#173c61 0%,#0b1f38 32%,#030d1c 72%,#010812 100%);

    color:#fff;
    overflow-x:hidden;
    overflow-y:auto;
}

.app{
    width:calc(100% - 12px);
    max-width:460px;
    margin:6px auto;
    padding:9px;

    border:2px solid #e8bd45;
    border-radius:22px;

    background:
        radial-gradient(
            ellipse at 50% 0%,
            rgba(30,79,126,.48) 0%,
            transparent 42%
        ),
        linear-gradient(
            145deg,
            #020b17 0%,
            #07182c 25%,
            #0b2743 48%,
            #06182c 72%,
            #020a15 100%
        );

    box-shadow:
        inset 0 0 35px rgba(0,0,0,.65),
        inset 0 1px 2px rgba(255,255,255,.12),
        0 10px 30px rgba(0,0,0,.5);
}

.header{
    position:relative;
    height:55px;

    display:flex;
    align-items:center;
    justify-content:center;
}

.title{
    width:100%;
    margin:0;

    color:#ffd21c;
    text-align:center;
    white-space:nowrap;

    font-size:21px;
    font-weight:700;

    text-shadow:0 2px 4px rgba(0,0,0,.7);
}

.language{
    position:absolute;
    left:2px;
    top:5px;

    width:78px;
    height:29px;

    border:1px solid #e8bd45;
    border-radius:9px;

    background:#10284a;
    color:#fff;

    font-family:inherit;
    font-size:10px;
    font-weight:600;

    padding:0 5px;
}

.intro{
    border:2px solid #e8bd45;
    border-radius:13px;

    padding:9px 10px;
    margin-bottom:8px;

    background:
        linear-gradient(
            145deg,
            #102e50,
            #061a30
        );

    color:#fff;

    text-align:center;
    font-size:12px;
    line-height:1.65;
    font-weight:500;
}

.explanation{
    border:2px solid #e8bd45;
    border-radius:15px;

    padding:4px 10px;

    background:
        linear-gradient(
            145deg,
            rgba(8,37,65,.96),
            rgba(2,15,30,.98)
        );
}

.step{
    padding:7px 0 8px;

    border-bottom:1px solid rgba(232,189,69,.28);
}

.step:last-child{
    border-bottom:none;
}

.step-title{
    color:#ffd21c;
    font-size:13px;
    font-weight:700;

    margin-bottom:3px;
}

.step-text{
    color:#fff;
    font-size:11.5px;
    line-height:1.6;
    font-weight:500;
}

.number{
    color:#ffd21c;
    font-weight:700;
}

.amount{
    color:#ffd21c;
    font-weight:700;
    white-space:nowrap;
}

.back-btn{
    width:100%;
    height:46px;

    margin-top:9px;

    border:2px solid #e8bd45;
    border-radius:13px;

    background:
        linear-gradient(
            145deg,
            #ffe91a,
            #d7e900
        );

    color:#26334b;

    font-family:inherit;
    font-size:15px;
    font-weight:700;
}

.back-btn:active{
    transform:scale(.985);
}

.footer{
    margin-top:8px;
    padding-top:6px;

    border-top:1px solid #e8bd45;

    text-align:center;
}

.footer a{
    color:#fff;
    text-decoration:none;

    font-size:11px;
    font-weight:500;
}

.developer{
    margin-top:3px;

    color:#fff;
    font-size:11px;
    font-weight:600;
}

@media(max-width:380px){

    .title{
        font-size:19px;
    }

    .intro{
        font-size:11px;
    }

    .step{
        padding:6px 0 7px;
    }

    .step-title{
        font-size:12px;
    }

    .step-text{
        font-size:10.5px;
    }
}
</style>
</head>

<body>

<div class="app">

    <header class="header">

        <select
            id="language"
            class="language"
            onchange="changeLanguage(this.value)">

            <option value="ar">العربية</option>
            <option value="en">English</option>
            <option value="fr">Français</option>
            <option value="it">Italiano</option>
            <option value="de">Deutsch</option>

        </select>

        <h1
            class="title"
            id="pageTitle">
            المساعد الذكي
        </h1>

    </header>


    <div
        class="intro"
        id="intro">
        يشرح لك المساعد الذكي العملية التي أجرتها الحاسبة
        بطريقة بسيطة وواضحة، من القيمة الاسمية حتى المبلغ
        المسترد والعائد السنوي.
    </div>


    <div
        class="explanation"
        id="explanation">
    </div>


    <button
        class="back-btn"
        id="backBtn"
        onclick="goBack()">
        ← العودة إلى الحاسبة
    </button>


    <footer class="footer">

        <a
            href="privacy.html"
            id="privacy">
            سياسة الخصوصية
        </a>

        <span style="color:#e8bd45;"> | </span>

        <a
            href="about.html"
            id="guide">
            دليل أذون الخزانة
        </a>

        <div
            class="developer"
            id="developer">
            أ/ طارق متولي
        </div>

    </footer>

</div>


<script>

    day:"Tage",

};


/* =========================
   بيانات العملية
========================= */

let operation = null;


function loadOperation(){

    try{

        const saved =
            localStorage.getItem(
                "lastTreasuryOperation"
            );

        if(saved){

            operation =
                JSON.parse(saved);

        }

    }catch(e){

        operation = null;

    }


    /*
       إذا لم توجد آخر عملية،
       نقرأ آخر عملية من العمليات المحفوظة
    */

    if(!operation){

        try{

            const list =
                JSON.parse(
                    localStorage.getItem(
                        "treasuryOperations"
                    )
                ) || [];

            if(list.length){

                operation =
                    list[0];

            }

        }catch(e){

            operation = null;

        }

    }

}


/* =========================
   تنسيق الأموال
========================= */

function money(value){

    return Number(value).toLocaleString(
        "en-US",
        {
            minimumFractionDigits:2,
            maximumFractionDigits:2
        }
    );

}


/* =========================
   اللغة الحالية
========================= */

function getLanguage(){

    return localStorage.getItem(
        "calculatorLanguage"
    ) || "ar";

}


/* =========================
   بناء الشرح
========================= */

function renderAssistant(){

    const lang =
        getLanguage();

    const t =
        translations[lang];


    if(!operation){

        document.getElementById(
            "explanation"
        ).innerHTML = `

            <div class="step">

                <div class="step-title">
                    ${t.title}
                </div>

                <div class="step-text">
                    لا توجد عملية متاحة لشرحها حاليًا.
                </div>

            </div>

        `;

        return;

    }


    const market =
        operation.market === "primary"
        ? t.primary
        : t.secondary;


    document.getElementById(
        "explanation"
    ).innerHTML = `

        <div class="step">

            <div class="step-title">
                1. ${t.nominalTitle}
            </div>

            <div class="step-text">
                ${t.nominalText}
                <span class="amount">
                    ${money(operation.nominal)}
                </span>
                ${t.pound}.
            </div>

        </div>


        <div class="step">

            <div class="step-title">
                2. ${t.marketTitle}
            </div>

            <div class="step-text">

                ${market}
                -
                <span class="amount">
                    ${operation.days}
                </span>
                ${t.day}.

            </div>

        </div>


        <div class="step">

            <div class="step-title">
                3. ${t.rateTitle}
            </div>

            <div class="step-text">

                ${t.rateText}
                <span class="amount">
                    ${Number(operation.rate).toFixed(2)}%
                </span>.

            </div>

        </div>


        <div class="step">

            <div class="step-title">
                4. ${t.purchaseTitle}
            </div>

            <div class="step-text">

                ${t.purchaseText}
                <span class="amount">
                    ${money(operation.purchase)}
                </span>
                ${t.pound}.

            </div>

        </div>


        <div class="step">

            <div class="step-title">
                5. ${t.discountTitle}
            </div>

            <div class="step-text">

                ${t.discountText}
                <span class="amount">
                    ${money(operation.discount)}
                </span>
                ${t.pound}.

            </div>

        </div>


        <div class="step">

            <div class="step-title">
                6. ${t.taxTitle}
            </div>

            <div class="step-text">

                ${t.taxText}
                <span class="amount">
                    ${money(operation.tax)}
                </span>
                ${t.pound}.

            </div>

        </div>


        <div class="step">

            <div class="step-title">
                7. ${t.profitTitle}
            </div>

            <div class="step-text">

                ${t.profitText}
                <span class="amount">
                    ${money(operation.netProfit)}
                </span>
                ${t.pound}.

            </div>

        </div>


        <div class="step">

            <div class="step-title">
                8. ${t.totalTitle}
            </div>

            <div class="step-text">

                ${t.totalText}
                <span class="amount">
                    ${money(operation.total)}
                </span>
                ${t.pound}.

            </div>

        </div>


        <div class="step">

            <div class="step-title">
                9. ${t.annualTitle}
            </div>

            <div class="step-text">

                ${t.annualText}
                <span class="amount">
                    ${Number(operation.annualYield).toFixed(2)}%
                </span>.

            </div>

        </div>

    `;

}


/* =========================
   تغيير اللغة
========================= */

function changeLanguage(lang){

    localStorage.setItem(
        "calculatorLanguage",
        lang
    );

    applyLanguage(lang);

}


function applyLanguage(lang){

    const t =
        translations[lang];


    document.documentElement.lang =
        lang;

    document.documentElement.dir =
        lang === "ar"
        ? "rtl"
        : "ltr";


    document.getElementById(
        "pageTitle"
    ).textContent =
        t.title;


    document.getElementById(
        "intro"
    ).textContent =
        t.intro;


    document.getElementById(
        "backBtn"
    ).textContent =
        t.back;


    document.getElementById(
        "privacy"
    ).textContent =
        t.privacy;


    document.getElementById(
        "guide"
    ).textContent =
        t.guide;


    document.getElementById(
        "developer"
    ).textContent =
        t.developer;


    document.getElementById(
        "language"
    ).value =
        lang;


    const title =
        document.querySelector(
            ".title"
        );


    if(lang === "ar"){

        title.style.fontSize =
            window.innerWidth <= 380
            ? "19px"
            : "21px";

    }else if(lang === "en"){

        title.style.fontSize =
            "18px";

    }else if(lang === "fr" || lang === "it"){

        title.style.fontSize =
            "16px";

    }else{

        title.style.fontSize =
            "15px";

    }


    renderAssistant();

}


/* =========================
   العودة للحاسبة
========================= */

function goBack(){

    window.location.href =
        "index.html";

}


/* =========================
   التشغيل
========================= */

loadOperation();

const savedLanguage =
    getLanguage();

applyLanguage(
    savedLanguage
);

</script>

</body>
</html>
