<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>حفظ العمليتين</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
}

body{
    font-family:
        "Geeza Pro",
        "Avenir Next",
        -apple-system,
        BlinkMacSystemFont,
        sans-serif;

    background:
        radial-gradient(circle at 50% 8%,#173c61 0%,#0b1f38 30%,#030d1c 72%,#010812 100%);

    color:#fff;
    overflow-x:hidden;
    overflow-y:auto;
}

.app{
    width:calc(100% - 12px);
    max-width:460px;
    margin:6px auto;
    padding:9px;

    border:2px solid #e8bd45;
    border-radius:22px;

    background:
        radial-gradient(ellipse at 50% 0%,rgba(30,79,126,.48),transparent 42%),
        linear-gradient(145deg,#020b17 0%,#07182c 25%,#0b2743 48%,#06182c 72%,#020a15 100%);

    box-shadow:
        inset 0 0 35px rgba(0,0,0,.65),
        inset 0 1px 2px rgba(255,255,255,.12),
        0 10px 30px rgba(0,0,0,.5);
}

.header{
    position:relative;
    min-height:58px;
    display:flex;
    justify-content:center;
    align-items:center;
}

.title{
    width:100%;
    margin:0;
    color:#fff;
    font-size:21px;
    font-weight:700;
    text-align:center;
    white-space:nowrap;
    text-shadow:0 2px 4px rgba(0,0,0,.65);
}

.subtitle{
    text-align:center;
    color:#ffd21c;
    font-size:14px;
    font-weight:600;
    margin:3px 0 10px;
}

.operations{
    display:flex;
    flex-direction:column;
    gap:9px;
}

.operation{
    border:2px solid #e8bd45;
    border-radius:15px;

    background:
        linear-gradient(145deg,#092b49,#03182d 55%,#020e1d);

    padding:9px;

    box-shadow:
        inset 0 1px 5px rgba(255,255,255,.06);
}

.operation-head{
    display:flex;
    justify-content:space-between;
    align-items:center;

    margin-bottom:7px;
    padding-bottom:6px;

    border-bottom:1px solid #e8bd45;
}

.operation-number{
    color:#ffd21c;
    font-size:15px;
    font-weight:700;
}

.market{
    color:#fff;
    font-size:13px;
    font-weight:500;
}

.data-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:6px;
}

.data{
    min-height:48px;

    border:1px solid #e8bd45;
    border-radius:10px;

    background:
        linear-gradient(145deg,#0b3152,#03192e);

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    text-align:center;
    padding:4px;
}

.label{
    color:#fff;
    font-size:11px;
    font-weight:500;
    line-height:1.15;
}

.value{
    color:#ffd21c;
    font-size:16px;
    font-weight:600;
    margin-top:3px;
}

.delete-btn{
    width:100%;
    height:38px;

    margin-top:7px;

    border:1px solid #e8bd45;
    border-radius:10px;

    background:
        linear-gradient(145deg,#172e46,#071a2e);

    color:#fff;

    font-family:inherit;
    font-size:13px;
    font-weight:600;
}

.delete-btn:active{
    transform:scale(.985);
}

.empty{
    display:none;

    text-align:center;

    border:2px solid #e8bd45;
    border-radius:15px;

    padding:25px 10px;

    background:
        linear-gradient(145deg,#092b49,#03182d 55%,#020e1d);

    color:#fff;

    font-size:15px;
    font-weight:600;
}

.back-btn{
    width:100%;
    height:47px;

    margin-top:9px;

    border:2px solid #e8bd45;
    border-radius:13px;

    background:
        linear-gradient(145deg,#1670ae,#083b67 45%,#052544);

    color:#fff;

    font-family:inherit;
    font-size:17px;
    font-weight:700;
}

.back-btn:active{
    transform:scale(.985);
}

.footer{
    margin-top:8px;
    padding-top:7px;
    padding-bottom:3px;

    border-top:1px solid #e8bd45;

    text-align:center;
}

.footer a{
    color:#fff;
    text-decoration:none;
    font-size:12px;
    font-weight:500;
}

.developer{
    margin-top:4px;
    color:#ffd21c;
    font-size:12px;
    font-weight:600;
}

@media(max-width:380px){

    .title{
        font-size:19px;
    }

    .value{
        font-size:15px;
    }

    .label{
        font-size:10px;
    }
}
</style>
</head>

<body>

<div class="app">

    <header class="header">
        <h1 class="title" id="pageTitle">
            حفظ العمليتين
        </h1>
    </header>

    <div class="subtitle" id="subtitle">
        آخر عمليتين محفوظتين
    </div>

    <div id="operations" class="operations"></div>

    <div id="empty" class="empty">
        لا توجد عمليات محفوظة حاليًا
    </div>

    <button
        type="button"
        class="back-btn"
        onclick="goBack()"
        id="backBtn">
        العودة إلى الحاسبة
    </button>

    <footer class="footer">

        <a href="privacy.html" id="privacy">
            سياسة الخصوصية
        </a>

        <span style="color:#e8bd45;"> | </span>

        <a href="about.html" id="guide">
            دليل أذون الخزانة
        </a>

        <div class="developer">
            أ/ طارق متولي
        </div>

    </footer>

</div>

<script>

const operationsBox =
    document.getElementById("operations");

const emptyBox =
    document.getElementById("empty");


function money(value){

    return Number(value).toLocaleString(
        "en-US",
        {
            minimumFractionDigits:2,
            maximumFractionDigits:2
        }
    );
}


function loadOperations(){

    let operations = [];

    try{

        operations =
            JSON.parse(
                localStorage.getItem(
                    "treasuryOperations"
                )
            ) || [];

    }catch(e){

        operations = [];

    }


    operations =
        operations.slice(0,2);


    operationsBox.innerHTML = "";


    if(operations.length === 0){

        emptyBox.style.display = "block";

        return;
    }


    emptyBox.style.display = "none";


    operations.forEach(
        function(op,index){

            const card =
                document.createElement("div");

            card.className =
                "operation";


            const market =
                op.market === "primary"
                ? "السوق الأولي"
                : "السوق الثانوي";


            card.innerHTML = `

                <div class="operation-head">

                    <div class="operation-number">
                        العملية ${index + 1}
                    </div>

                    <div class="market">
                        ${market}
                    </div>

                </div>


                <div class="data-grid">

                    <div class="data">
                        <div class="label">
                            القيمة الاسمية
                        </div>
                        <div class="value">
                            ${money(op.nominal)}
                        </div>
                    </div>


                    <div class="data">
                        <div class="label">
                            سعر العائد
                        </div>
                        <div class="value">
                            ${Number(op.rate).toFixed(2)}%
                        </div>
                    </div>


                    <div class="data">
                        <div class="label">
                            المدة
                        </div>
                        <div class="value">
                            ${op.days} يوم
                        </div>
                    </div>


                    <div class="data">
                        <div class="label">
                            قيمة الشراء
                        </div>
                        <div class="value">
                            ${money(op.purchase)}
                        </div>
                    </div>


                    <div class="data">
                        <div class="label">
                            خصم الشراء
                        </div>
                        <div class="value">
                            ${money(op.discount)}
                        </div>
                    </div>


                    <div class="data">
                        <div class="label">
                            الضريبة
                        </div>
                        <div class="value">
                            ${money(op.tax)}
                        </div>
                    </div>


                    <div class="data">
                        <div class="label">
                            صافي الربح
                        </div>
                        <div class="value">
                            ${money(op.netProfit)}
                        </div>
                    </div>


                    <div class="data">
                        <div class="label">
                            العائد السنوي
                        </div>
                        <div class="value">
                            ${Number(op.annualYield).toFixed(2)}%
                        </div>
                    </div>

                </div>


                <div
                    class="data"
                    style="margin-top:6px;">

                    <div class="label">
                        المبلغ المسترد نهاية المدة
                    </div>

                    <div class="value">
                        ${money(op.total)}
                    </div>

                </div>


                <button
                    type="button"
                    class="delete-btn"
                    onclick="deleteOperation(${index})">

                    حذف العملية

                </button>

            `;


            operationsBox.appendChild(card);

        }
    );

}


function deleteOperation(index){

    let operations = [];

    try{

        operations =
            JSON.parse(
                localStorage.getItem(
                    "treasuryOperations"
                )
            ) || [];

    }catch(e){

        operations = [];

    }


    operations.splice(index,1);


    localStorage.setItem(
        "treasuryOperations",
        JSON.stringify(operations)
    );


    loadOperations();
}


function goBack(){

    window.location.href =
        "index.html";

}


loadOperations();

</script>

</body>
</html>
