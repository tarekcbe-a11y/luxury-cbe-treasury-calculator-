<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>سياسة الخصوصية</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
}

body{
    font-family:
        "Geeza Pro",
        "Avenir Next",
        -apple-system,
        BlinkMacSystemFont,
        sans-serif;

    background:
        radial-gradient(circle at 50% 8%,#173c61 0%,#0b1f38 32%,#030d1c 72%,#010812 100%);

    color:#fff;
    overflow-x:hidden;
    overflow-y:auto;
}

.app{
    width:calc(100% - 12px);
    max-width:460px;
    margin:6px auto;
    padding:9px;

    border:2px solid #e8bd45;
    border-radius:22px;

    background:
        radial-gradient(
            ellipse at 50% 0%,
            rgba(30,79,126,.48) 0%,
            transparent 42%
        ),
        linear-gradient(
            145deg,
            #020b17 0%,
            #07182c 25%,
            #0b2743 48%,
            #06182c 72%,
            #020a15 100%
        );

    box-shadow:
        inset 0 0 35px rgba(0,0,0,.65),
        inset 0 1px 2px rgba(255,255,255,.12),
        0 10px 30px rgba(0,0,0,.5);
}

.header{
    position:relative;
    height:55px;

    display:flex;
    align-items:center;
    justify-content:center;
}

.title{
    width:100%;
    margin:0;

    color:#ffd21c;
    text-align:center;
    white-space:nowrap;

    font-size:21px;
    font-weight:700;

    text-shadow:0 2px 4px rgba(0,0,0,.7);
}

.language{
    position:absolute;
    left:2px;
    top:5px;

    width:78px;
    height:29px;

    border:1px solid #e8bd45;
    border-radius:9px;

    background:#10284a;
    color:#fff;

    font-family:inherit;
    font-size:10px;
    font-weight:600;

    padding:0 5px;
}

.content{
    border:2px solid #e8bd45;
    border-radius:15px;

    padding:4px 10px;

    background:
        linear-gradient(
            145deg,
            rgba(8,37,65,.96),
            rgba(2,15,30,.98)
        );
}

.section{
    padding:7px 0 8px;

    border-bottom:1px solid rgba(232,189,69,.28);
}

.section:last-child{
    border-bottom:none;
}

.section-title{
    color:#ffd21c;

    font-size:13px;
    font-weight:700;

    margin-bottom:3px;
}

.section-text{
    color:#fff;

    font-size:11px;
    line-height:1.6;
    font-weight:500;
}

.back-btn{
    width:100%;
    height:46px;

    margin-top:9px;

    border:2px solid #e8bd45;
    border-radius:13px;

    background:
        linear-gradient(
            145deg,
            #ffe91a,
            #d7e900
        );

    color:#26334b;

    font-family:inherit;
    font-size:15px;
    font-weight:700;
}

.back-btn:active{
    transform:scale(.985);
}

.footer{
    margin-top:8px;
    padding-top:6px;

    border-top:1px solid #e8bd45;

    text-align:center;
}

.footer a{
    color:#fff;
    text-decoration:none;

    font-size:11px;
    font-weight:500;
}

.developer{
    margin-top:3px;

    color:#fff;
    font-size:11px;
    font-weight:600;
}

@media(max-width:380px){

    .title{
        font-size:19px;
    }

    .language{
        width:74px;
        height:27px;
        font-size:9px;
    }

    .section{
        padding:6px 0 7px;
    }

    .section-title{
        font-size:12px;
    }

    .section-text{
        font-size:10.5px;
        line-height:1.55;
    }
}
</style>
</head>

<body>

<div class="app">

<header class="header">

<select
    id="language"
    class="language"
    onchange="changeLanguage(this.value)">

    <option value="ar">العربية</option>
    <option value="en">English</option>
    <option value="fr">Français</option>
    <option value="it">Italiano</option>
    <option value="de">Deutsch</option>

</select>

<h1
    class="title"
    id="pageTitle">
    سياسة الخصوصية
</h1>

</header>


<div
    class="content"
    id="content">
</div>


<button
    class="back-btn"
    id="backBtn"
    onclick="goBack()">
    ← العودة إلى الحاسبة
</button>


<footer class="footer">

<a
    href="privacy.html"
    id="privacy">
    سياسة الخصوصية
</a>

<span style="color:#e8bd45;"> | </span>

<a
    href="about.html"
    id="guide">
    دليل أذون الخزانة
</a>

<div
    class="developer"
    id="developer">
    أ/ طارق متولي
</div>

</footer>

</div>

]

],
[

"Gespeicherte Vorgänge werden lokal auf dem Gerät gespeichert und nicht an externe Server gesendet."

],

back:"← Zum Rechner",

developer:"Tarek Metwally"
}

};


function getLanguage(){

return localStorage.getItem(
"calculatorLanguage"
)||"ar";

}


function render(lang){

const t=translations[lang];

document.documentElement.lang=lang;

document.documentElement.dir=
lang==="ar"?"rtl":"ltr";

document.getElementById(
"pageTitle"
).textContent=t.title;

document.getElementById(
"backBtn"
).textContent=t.back;

document.getElementById(
"privacy"
).textContent=t.privacy;

document.getElementById(
"guide"
).textContent=t.guide;

document.getElementById(
"developer"
).textContent=t.developer;

document.getElementById(
"language"
).value=lang;


let html="";

t.sections.forEach(section=>{

html+=`

<div class="section">

<div class="section-title">
${section[0]}
</div>

<div class="section-text">
${section[1]}
</div>

</div>

`;

});

document.getElementById(
"content"
).innerHTML=html;


const title=
document.querySelector(".title");

if(lang==="ar"){

title.style.fontSize=
window.innerWidth<=380
?"19px"
:"21px";

}else if(lang==="en"){

title.style.fontSize="18px";

}else if(lang==="fr"||lang==="it"){

title.style.fontSize="16px";

}else{

title.style.fontSize="15px";

}

}


function changeLanguage(lang){

localStorage.setItem(
"calculatorLanguage",
lang
);

render(lang);

}


function goBack(){

window.location.href="index.html";

}


render(getLanguage());

</script>

</body>
</html>عنتر
