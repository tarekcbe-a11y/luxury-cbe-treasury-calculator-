<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<title>حاسبة أذون الخزانة المصرية</title>

<style>

/* =========================
   RESET
========================= */

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
}

body{

    font-family:
        "Geeza Pro",
        "Avenir Next",
        -apple-system,
        BlinkMacSystemFont,
        sans-serif;

    background:
        radial-gradient(
            circle at 50% 8%,
            #173c61 0%,
            #0b1f38 30%,
            #030d1c 72%,
            #010812 100%
        );

    color:#fff;

    overflow-x:hidden;
    overflow-y:auto;

    touch-action:manipulation;
}


/* =========================
   APP
========================= */

.app{

    width:calc(100% - 12px);
    max-width:460px;

    margin:6px auto;

    padding:9px;

    border:2px solid #e8bd45;
    border-radius:22px;

    background:
        radial-gradient(
            ellipse at 50% 0%,
            rgba(30,79,126,.48) 0%,
            transparent 42%

        linear-gradient(
            145deg,
            #020b17 0%,
            #07182c 25%,
            #0b2743 48%,
            #06182c 72%,
            #020a15 100%

    box-shadow:
        inset 0 0 35px rgba(0,0,0,.65),
        inset 0 1px 2px rgba(255,255,255,.12),
        0 10px 30px rgba(0,0,0,.5);

    overflow:visible;
}


/* =========================
   HEADER
========================= */

.header{

    position:relative;

    height:65px;

    padding-top:3px;

    display:flex;

    justify-content:center;

    align-items:flex-end;
}


/* =========================
   LANGUAGE
========================= */

.language-box{

}

#languageSelect{

    width:82px;

    border-radius:9px;

        linear-gradient(

            #0c3154,
            #03172c

    color:#fff;

    font-family:
        "Geeza Pro",
        "Avenir Next",
        -apple-system,
        BlinkMacSystemFont,

    font-weight:700;

    outline:none;
}


/* =========================
   TITLE
   يظهر مرة واحدة فقط
========================= */

.title{

    width:100%;

    margin:0;
    padding:0;

    color:#fff;

    font-family:
        "Geeza Pro",
        "Avenir Next",
        -apple-system,
        BlinkMacSystemFont,

    font-size:21px;

    font-weight:700;

    line-height:1.05;

    white-space:nowrap;

    text-align:center;

    letter-spacing:0;

    text-shadow:
        0 2px 4px rgba(0,0,0,.65);
}


/* اللغات الأجنبية */

html[lang="en"] .title{
    font-size:18px;
}

html[lang="fr"] .title{
    font-size:16px;
}

html[lang="it"] .title{
    font-size:16px;
}

html[lang="de"] .title{
    font-size:15px;
}


/* =========================
   MARKETS
========================= */

.market-switch{

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:8px;

    margin-top:8px;
    margin-bottom:8px;
}

.market-btn{

    height:48px;

    border:2px solid #e8bd45;

    border-radius:14px;

    background:
        linear-gradient(

            #0b2e4d,

        "Geeza Pro",
        "Avenir Next",
        -apple-system,
        BlinkMacSystemFont,
        sans-serif;

    font-size:18px;
    font-weight:700;

    box-shadow:
        inset 0 1px 5px rgba(255,255,255,.08),
        0 3px 7px rgba(0,0,0,.35);
}

.market-btn.active{

    background:
        linear-gradient(
            145deg,
            #ffe36f,
            #ffcc19
        );

    color:#07182d;

    box-shadow:
        inset 0 1px 3px rgba(255,255,255,.55),
        0 3px 8px rgba(0,0,0,.35);
}


/* =========================
   INPUTS
========================= */

.fields{

    display:flex;

    flex-direction:column;

    gap:8px;

    margin-bottom:8px;
}

.input-wrap{

    position:relative;

    width:100%;
}

.input-wrap input,

    width:100%;

    border:2px solid #e8bd45;

            #092945,

    font-family:

        "Avenir Next",
        -apple-system,
        BlinkMacSystemFont,
        sans-serif;

    font-size:17px;

    font-weight:500;

    outline:none;

    box-shadow:
        inset 0 1px 6px rgba(0,0,0,.55);
}


/* الأرقام من اليمين */

.input-wrap input{

    direction:rtl;

    text-align:right;

    padding:0 16px;
}

.input-wrap input::placeholder{

    color:#fff;

    opacity:.88;
}


/* =========================
   DAYS
========================= */

.days-wrap{

    position:relative;
}

#days{

    direction:rtl;

    text-align:right;

    padding:0 16px 0 42px;

    appearance:none;

    -webkit-appearance:none;

    cursor:pointer;
}


/* مؤشر الأيام */

.days-arrow{

    position:absolute;

    left:15px;

    top:50%;

    width:12px;
    height:12px;

    border-bottom:4px solid #e8bd45;

        translateY(-72%)

    z-index:5;
}


/* =========================
   CALCULATE
========================= */

.calculate-btn{

    width:100%;

    height:51px;

    margin-bottom:9px;

    border:2px solid #e8bd45;

    border-radius:14px;

    background:
        linear-gradient(
            145deg,
            #1670ae,
            #083b67 45%,
            #052544

    font-family:
        "Geeza Pro",
        "Avenir Next",
        -apple-system,
        BlinkMacSystemFont,
        sans-serif;

    font-size:21px;

    font-weight:800;

    box-shadow:

}

.calculate-btn:active,
.action-btn:active,
.market-btn:active{

    transform:scale(.985);
}


/* =========================
   RESULTS
========================= */

.results-grid{

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:8px;

    margin-bottom:8px;
}

.result-card{

    height:84px;

    border:2px solid #e8bd45;

    border-radius:14px;

    background:
        linear-gradient(
            145deg,
            #092b49,
            #03182d 55%,

    flex-direction:column;

    justify-content:center;

    align-items:center;

    text-align:center;

/* عناوين النتائج */

.result-label{

        "Avenir Next",

        BlinkMacSystemFont,

/* =========================

/* =========================

========================= */

.total{

.annual span{

}


/* =========================
   ACTIONS
========================= */

.actions{

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:8px;

    margin-bottom:8px;
}

.action-btn{

    height:45px;

    border:2px solid #e8bd45;

    border-radius:13px;

    background:
        linear-gradient(
            145deg,
            #0b3152,
            #03192e
        );

    color:#fff;

    font-family:
        "Geeza Pro",
        "Avenir Next",
        -apple-system,
        BlinkMacSystemFont,

    font-size:15px;

}

.action-btn.primary{

/* =========================

.footer{

.footer-links{

/* =========================

    }

    .annual{

/* =========================

html[dir="ltr"] .input-wrap input{

}

}

</style>

<script>

/* =====================================================
   TRANSLATIONS
===================================================== */

const translations = {

    ar:{
        title:"حاسبة أذون الخزانة المصرية",
        primary:"السوق الأولي",
        secondary:"السوق الثانوي",
        nominal:"القيمة الاسمية",
        rate:"سعر العائد (%)",
        calculate:"احسب الآن",
        purchase:"قيمة الشراء",
        discount:"خصم الشراء",
        tax:"الضريبة",
        profit:"صافي الربح بعد خصم الضريبة",
        total:"المبلغ المسترد نهاية المدة",
        annual:"نسبة العائد السنوي:",
        save:"حفظ العمليتين",
        assistant:"مساعدك الذكي",
        privacy:"سياسة الخصوصية",
        guide:"دليل أذون الخزانة",
        days:"يوم"
    },


    en:{
        title:"Egyptian Treasury Bills Calculator",
        primary:"Primary Market",
        secondary:"Secondary Market",
        nominal:"Nominal Value",
        rate:"Interest Rate (%)",
        calculate:"Calculate Now",
        purchase:"Purchase Value",
        discount:"Purchase Discount",
        tax:"Tax",
        profit:"Net Profit After Tax",
        total:"Amount Returned at Maturity",
        annual:"Annual Yield:",
        save:"Save Operations",
        assistant:"Smart Assistant",
        privacy:"Privacy Policy",
        guide:"Treasury Bills Guide",
        days:"days"
    },


    fr:{
        title:"Calculateur de bons du Trésor égyptiens",
        primary:"Marché primaire",
        secondary:"Marché secondaire",
        nominal:"Valeur nominale",
        rate:"Taux d’intérêt (%)",
        calculate:"Calculer maintenant",
        purchase:"Valeur d’achat",
        discount:"Décote d’achat",
        tax:"Impôt",
        profit:"Bénéfice net après impôt",
        total:"Montant remboursé à l’échéance",
        annual:"Rendement annuel :",
        save:"Enregistrer les 2 opérations",
        assistant:"Assistant intelligent",
        privacy:"Politique de confidentialité",
        guide:"Guide des bons du Trésor",
        days:"jours"
    },


    it:{
        title:"Calcolatore dei Buoni del Tesoro egiziani",
        primary:"Mercato primario",
        secondary:"Mercato secondario",
        nominal:"Valore nominale",
        rate:"Tasso di rendimento (%)",
        calculate:"Calcola ora",
        purchase:"Valore di acquisto",
        discount:"Sconto di acquisto",
        tax:"Imposta",
        profit:"Profitto netto dopo le imposte",
        total:"Importo rimborsato alla scadenza",
        annual:"Rendimento annuo:",
        save:"Salva le 2 operazioni",
        assistant:"Assistente intelligente",
        privacy:"Informativa sulla privacy",
        guide:"Guida ai Buoni del Tesoro",
        days:"giorni"
    },


    de:{
        title:"Ägyptischer Schatzwechsel-Rechner",
        primary:"Primärmarkt",
        secondary:"Sekundärmarkt",
        nominal:"Nennwert",
        rate:"Rendite (%)",
        calculate:"Jetzt berechnen",
        purchase:"Kaufwert",
        discount:"Kaufabschlag",
        tax:"Steuer",
        profit:"Nettogewinn nach Steuern",
        total:"Rückzahlungsbetrag bei Fälligkeit",
        annual:"Jährliche Rendite:",
        save:"2 Vorgänge speichern",
        assistant:"Intelligenter Assistent",
        privacy:"Datenschutzerklärung",
        guide:"Leitfaden für Schatzwechsel",
        days:"Tage"
    }

};


/* =====================================================
   STATE
===================================================== */

let currentLanguage =
    localStorage.getItem("calculatorLanguage") || "ar";


let currentMarket =
    localStorage.getItem("calculatorMarket") || "primary";


const languageSelect =
    document.getElementById("languageSelect");


const nominalInput =
    document.getElementById("nominal");


const rateInput =
    document.getElementById("rate");


const daysSelect =
    document.getElementById("days");


/* =====================================================
   NUMBER FORMAT
===================================================== */

function formatNumber(value){

    if(
        value === "" ||
        value === null ||
        value === undefined
    ){

        return "";

    }


    let cleaned =
        String(value)
        .replace(/,/g,"")
        .replace(/[^\d.]/g,"");


    if(!cleaned){

        return "";

    }


    let parts =
        cleaned.split(".");


    let integerPart =
        parts[0] || "0";


    let decimalPart =
        parts.length > 1
        ? "." + parts[1].slice(0,3)
        : "";


    integerPart =
        Number(integerPart)
        .toLocaleString("en-US");


    return integerPart + decimalPart;
}


/* =====================================================
   NOMINAL FORMAT
===================================================== */

nominalInput.addEventListener(
    "input",
    function(){

        let cursor =
            this.selectionStart;


        let oldLength =
            this.value.length;


        this.value =
            formatNumber(this.value);


        let newLength =
            this.value.length;


        cursor +=
            newLength - oldLength;


        try{

            this.setSelectionRange(
                cursor,
                cursor
            );

        }catch(e){}

    }
);


/* =====================================================
   DAYS
===================================================== */

function updateDays(){

    let previous =
        parseInt(daysSelect.value);


    if(isNaN(previous)){

        previous = 91;

    }


    daysSelect.innerHTML = "";


    const t =
        translations[currentLanguage];


    /* السوق الأولي */

    if(currentMarket === "primary"){

        [91,182,273,364].forEach(
            function(day){

                const option =
                    document.createElement("option");


                option.value =
                    day;


                option.textContent =
                    day + " " + t.days;


                daysSelect.appendChild(
                    option
                );

            }
        );


        if(
            [91,182,273,364]
            .includes(previous)
        ){

            daysSelect.value =
                previous;

        }else{

            daysSelect.value =
                91;

        }

    }


    /* السوق الثانوي */

    else{

        for(
            let day = 1;
            day <= 364;
            day++
        ){

            const option =
                document.createElement("option");


            option.value =
                day;


            option.textContent =
                day + " " + t.days;


            daysSelect.appendChild(
                option
            );

        }


        if(
            previous >= 1 &&
            previous <= 364
        ){

            daysSelect.value =
                previous;

        }else{

            daysSelect.value =
                1;

        }

    }

}


/* =====================================================
   MARKET
===================================================== */

function setMarket(market){

    currentMarket =
        market;


    localStorage.setItem(
        "calculatorMarket",
        currentMarket
    );


    document
        .getElementById("primaryBtn")
        .classList.toggle(
            "active",
            market === "primary"
        );


    document
        .getElementById("secondaryBtn")
        .classList.toggle(
            "active",
            market === "secondary"
        );


    updateDays();

}

languageSelect.value =
    currentLanguage;


languageSelect.addEventListener(
    "change",
    function(){

        currentLanguage =
            this.value;


        localStorage.setItem(
            "calculatorLanguage",
            currentLanguage
        );


        translatePage();

    }
);


/* =====================================================
   CALCULATE
===================================================== */

function calculate(){

    let nominal =
        parseFloat(
            nominalInput.value.replace(/,/g,"")
        );


    let rate =
        parseFloat(
            rateInput.value
        );


    let days =
        parseInt(
            daysSelect.value
        );


    if(
        isNaN(nominal) ||
        nominal <= 0 ||
        isNaN(rate) ||
        rate < 0 ||
        isNaN(days) ||
        days <= 0
    ){

        alert(
            currentLanguage === "ar"
            ? "برجاء إدخال البيانات المطلوبة."
            : "Please enter the required data."
        );

        return;

    }


    let purchase =
        nominal /
        (
            1 +
            (rate / 100) *
            (days / 365)
        );


    let discount =
        nominal - purchase;


    let tax =
        discount * 0.20;


    let netProfit =
        discount - tax;


    let total =
        purchase + netProfit;


    let annualYield =
        (netProfit / purchase) *
        (365 / days) *
        100;


    document.getElementById(
        "purchaseValue"
    ).textContent =
        formatMoney(purchase);


    document.getElementById(
        "discountValue"
    ).textContent =
        formatMoney(discount);


    document.getElementById(
        "taxValue"
    ).textContent =
        formatMoney(tax);


    document.getElementById(
        "profitValue"
    ).textContent =
        formatMoney(netProfit);


    document.getElementById(
        "totalValue"
    ).textContent =
        formatMoney(total);


    document.getElementById(
        "annualValue"
    ).textContent =
        annualYield.toFixed(2) + "%";


    saveLastOperation({

        market:currentMarket,
        nominal:nominal,
        rate:rate,
        days:days,
        purchase:purchase,
        discount:discount,
        tax:tax,
        netProfit:netProfit,
        total:total,
        annualYield:annualYield

    });

}


/* =====================================================
   MONEY
===================================================== */

function formatMoney(value){

    return Number(value)
        .toLocaleString(
            "en-US",
            {
                minimumFractionDigits:2,
                maximumFractionDigits:2
            }
        );

}


/* =====================================================
   LAST OPERATION
===================================================== */

function saveLastOperation(operation){

    localStorage.setItem(
        "lastTreasuryOperation",
        JSON.stringify(operation)
    );

}


/* =====================================================
   SAVE TWO OPERATIONS
===================================================== */

function saveOperations(){

    let nominal =
        parseFloat(
            nominalInput.value.replace(/,/g,"")
        );


    let rate =
        parseFloat(
            rateInput.value
        );


    let days =
        parseInt(
            daysSelect.value
        );


    if(
        isNaN(nominal) ||
        nominal <= 0 ||
        isNaN(rate) ||
        isNaN(days)
    ){

        alert(
            currentLanguage === "ar"
            ? "احسب العملية أولًا قبل حفظها."
            : "Calculate the operation first."
        );

        return;

    }


    let purchase =
        nominal /
        (
            1 +
            (rate / 100) *
            (days / 365)
        );


    let discount =
        nominal - purchase;


    let tax =
        discount * 0.20;


    let netProfit =
        discount - tax;


    let total =
        purchase + netProfit;


    let annualYield =
        (netProfit / purchase) *
        (365 / days) *
        100;


    let operation = {

        market:currentMarket,

        nominal:nominal,

        rate:rate,

        days:days,

        purchase:purchase,

        discount:discount,

        tax:tax,

        netProfit:netProfit,

        total:total,

        annualYield:annualYield,

        date:new Date().toLocaleString()

    };


    let saved = [];


    try{

        saved =
            JSON.parse(
                localStorage.getItem(
                    "treasuryOperations"
                )
            ) || [];

    }catch(e){

        saved = [];

    }


    saved.unshift(operation);


    if(saved.length > 2){

        saved =
            saved.slice(0,2);

    }


    localStorage.setItem(
        "treasuryOperations",
        JSON.stringify(saved)
    );


    window.location.href =
        "saved.html";

}


/* =====================================================
   SMART ASSISTANT
===================================================== */

function openAssistant(){

    let nominal =
        parseFloat(
            nominalInput.value.replace(/,/g,"")
        );


    let rate =
        parseFloat(
            rateInput.value
        );


    let days =
        parseInt(
            daysSelect.value
        );


    if(
        isNaN(nominal) ||
        nominal <= 0 ||
        isNaN(rate) ||
        isNaN(days)
    ){

        alert(
            currentLanguage === "ar"
            ? "برجاء إدخال البيانات وحساب العملية أولًا."
            : "Please enter the data and calculate first."
        );

        return;

    }


    calculate();


    window.location.href =
        "assistant.html";

}


/* =====================================================
   RESTORE
===================================================== */

function restoreValues(){

    let saved;


    try{

        saved =
            JSON.parse(
                localStorage.getItem(
                    "lastTreasuryOperation"
                )
            );

    }catch(e){

        saved = null;

    }


    if(!saved){

        return;

    }


    nominalInput.value =
        formatNumber(
            saved.nominal
        );


    rateInput.value =
        saved.rate;


    currentMarket =
        saved.market || "primary";


    setMarket(
        currentMarket
    );


    if(
        saved.days &&
        saved.days >= 1 &&
        saved.days <= 364
    ){

        daysSelect.value =
            saved.days;

    }


    if(
        saved.purchase !== undefined
    ){

        document.getElementById(
            "purchaseValue"
        ).textContent =
            formatMoney(
                saved.purchase
            );


        document.getElementById(
            "discountValue"
        ).textContent =
            formatMoney(
                saved.discount
            );


        document.getElementById(
            "taxValue"
        ).textContent =
            formatMoney(
                saved.tax
            );


        document.getElementById(
            "profitValue"
        ).textContent =
            formatMoney(
                saved.netProfit
            );


        document.getElementById(
            "totalValue"
        ).textContent =
            formatMoney(
                saved.total
            );


        document.getElementById(
            "annualValue"
        ).textContent =
            Number(
                saved.annualYield
            ).toFixed(2) + "%";

    }

}


/* =====================================================
   START
===================================================== */

translatePage();

setMarket(
    currentMarket
);

restoreValues();

</script>
